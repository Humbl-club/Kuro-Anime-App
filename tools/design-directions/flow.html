-items:center;gap:22px;margin:0 18px;height:41px}.scope button{height:36px;letter-spacing:1px;font-size:9px;color:var(--muted)}.scope button[aria-pressed=true]{color:var(--ink);border-bottom:1px solid}.scope span{margin-left:auto;font-size:9px;color:var(--muted)}.scroll{height:calc(100% - 119px);overflow:auto;scrollbar-width:none;overscroll-behavior:contain;scroll-behavior:smooth;padding:0 18px 26px;overflow-anchor:none}.scroll::-webkit-scrollbar{display:none}.heading{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:18px 0 12px}.heading h1,.heading h2{font:26px/.95 Georgia;margin:0;letter-spacing:-.8px}.heading small{font-size:9px;color:var(--muted);white-space:nowrap}.current-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px 9px}.tile{min-width:0;position:relative}.art-button{display:block;width:100%;position:relative;overflow:hidden;text-align:left}.active-image{display:block;width:100%;height:113px;object-fit:cover;background:#e8eae3}.portrait-only .active-image{object-fit:contain;background:#e6e9e0}.availability{position:absolute;bottom:0;left:0;background:var(--paper);padding:5px 7px 2px 0;font-size:8px;letter-spacing:.2px;pointer-events:none}.title{font:17px/1.03 Georgia;letter-spacing:-.35px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:8px 0 0}.tracking{display:flex;justify-content:space-between;align-items:center;gap:5px;min-height:42px;border-bottom:1px solid var(--line)}.tracking .count{font-size:10px}.tracking .plus{display:grid;place-items:center;min-width:44px;min-height:42px;font-size:22px;position:relative}.tracking .plus:active{background:var(--ink);color:white}.tracking .plus:disabled{font-size:15px;color:#757d6c}.club-peek{font-size:8px;min-height:30px;text-align:left;display:block;color:#616b56}.club-peek .avatar{display:inline-grid;place-items:center;width:16px;height:16px;border:1px solid #a2ac95;border-radius:50%;font-size:8px;margin-right:5px;color:var(--ink)}.inline{grid-column:1/-1;border-top:1px solid var(--ink);border-bottom:1px solid var(--line);padding:13px 0;display:flex;gap:12px;animation:unfold .22s ease}.inline img{width:53px;height:77px;object-fit:contain}.inline strong{font:21px/1.05 Georgia;display:block}.inline p{font-size:11px;color:var(--muted);line-height:1.4;margin:7px 0}.inline button{min-height:35px;font-size:10px;text-decoration:underline;margin-right:14px}.inline .close{margin-left:auto;align-self:start;font-size:21px;min-width:30px;text-decoration:none}.schedule{margin-top:26px;border-top:1px solid var(--ink)}.schedule>.heading{margin:16px 0 18px}.day{margin-bottom:21px}.day-label{position:sticky;top:0;z-index:3;background:var(--paper);display:flex;align-items:center;gap:11px;padding:10px 0;font-size:10px;isolation:isolate}.day-label:after{content:'';height:1px;background:var(--line);flex:1}.day-label small{font-size:9px;color:var(--muted)}.release-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 9px}.release{position:relative;min-width:0}.release .art-button img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block}.release .title{font:12px/1.15 Arial;margin-top:8px;letter-spacing:0}.release-meta{display:flex;justify-content:space-between;align-items:center;gap:4px;margin-top:3px;min-height:25px;font-size:9px;color:var(--muted)}.time-stamp{position:absolute;left:0;bottom:0;background:var(--paper);padding:5px 6px 0 0;font-size:9px;color:var(--ink)}.follow-button{min-height:30px;min-width:30px;font-size:15px}.new-section{border-top:1px solid var(--ink);padding-top:2px}.new-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 9px}.new-card img{display:block;width:100%;height:129px;object-fit:cover}.new-card .tag{position:absolute;top:7px;left:7px;background:var(--paper);padding:5px 6px;font-size:8px}.new-footer{display:flex;align-items:center;justify-content:space-between;gap:5px;min-height:48px}.new-footer .title{font-size:17px;margin:0}.new-footer small{display:block;margin-top:4px;font-size:9px;color:var(--muted)}.save-button{min-height:44px;min-width:40px;font-size:21px}.club-section{border-top:1px solid var(--ink);margin-top:23px;padding-top:2px}.club-images{display:grid;grid-template-columns:1fr 1fr;gap:10px}.club-image{position:relative;width:100%;text-align:left}.club-image>img{height:111px;width:100%;object-fit:cover;display:block}.club-image span{display:block;margin:8px 0 0;font:italic 16px/1.1 Georgia}.club-image small{display:block;font:9px Arial;color:var(--muted);margin-top:6px}.endmark{margin:26px 0 0;border-top:1px solid var(--line);padding:18px 0;font:italic 13px Georgia;color:var(--muted);text-align:center}.manga .current-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 10px}.manga .active-image{height:auto;aspect-ratio:2/3;object-fit:cover;box-shadow:3px 2px 0 #d2d6c8}.manga .art-button{overflow:visible}.manga .title{font-size:14px;letter-spacing:-.3px}.manga .availability{font-size:8px;padding:5px 5px 0 0}.manga .tracking{min-height:39px}.manga .tracking .plus{min-width:35px;min-height:42px}.manga .count{font-size:9px}.manga .current-grid .tile:last-of-type{grid-column:auto}.manga .release-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 10px}.manga .release img{box-shadow:3px 2px 0 #d2d6c8}.manga .new-card img{height:auto;aspect-ratio:2/3;object-fit:cover}.manga .new-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.manga .new-footer{align-items:start}.manga .new-footer .title{font:12px/1.15 Arial;white-space:normal}.manga .save-button{min-width:36px}.manga .new-footer small{font-size:8px}.manga .club-image>img{height:90px}.language{border:0;background:none;font-size:9px;color:var(--muted);max-width:82px}.empty{font:11px/1.5 Arial;color:var(--muted);padding:14px 0}.toast{position:absolute;bottom:16px;left:12px;right:12px;z-index:9;display:flex;align-items:center;justify-content:space-between;background:var(--ink);color:white;padding:10px 13px;box-shadow:0 4px 16px #0002;font-size:11px}.toast button{color:white;min-height:33px;text-decoration:underline}.footer{max-width:1000px;padding:0 24px 20px;margin:auto;font-size:10px;color:var(--muted)}@keyframes unfold{from{opacity:0;translate:0 -7px}to{opacity:1;translate:0 0}}@media(max-width:800px){.board{grid-template-columns:repeat(2,370px);overflow:auto;gap:25px}.board.single{overflow:visible}}@media(max-width:450px){.lab{padding:18px 13px}.lab small{max-width:195px;line-height:1.4}.lab-controls{flex-direction:column;gap:4px}.lab-controls button{min-height:30px}.board.single{padding:0 10px 20px}.active-image{height:107px}.title{font-size:16px}.scroll{padding-left:15px;padding-right:15px}.manga .title{font-size:13px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
.manga .current-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:17px 12px}.manga .current-grid .tile{display:grid;grid-template-columns:minmax(0,1fr)42px;align-content:start;column-gap:4px}.manga .current-grid .art-button{grid-column:1;grid-row:1}.manga .current-grid .active-image{height:155px;aspect-ratio:auto;object-fit:contain;box-shadow:none}.manga .current-grid .tracking{grid-column:2;grid-row:1;flex-direction:column;justify-content:end;border-bottom:0;border-left:1px solid var(--line);gap:9px;padding-bottom:4px}.manga .current-grid .tracking .count{white-space:nowrap}.manga .current-grid .title,.manga .current-grid .club-peek{grid-column:1/-1}.manga .current-grid .title{font-size:16px;margin-top:9px}.manga .current-grid .tracking .plus{min-width:40px;min-height:44px}.manga .current-grid .tile{border-bottom:1px solid var(--line);padding-bottom:8px}
</style></head><body><div class="lab"><div><strong>KURO / A living collection</strong><small>Scrollable Home study · All activity and release dates are fictional</small></div><div class="lab-controls"><button id="compare">Compare mediums</button><button id="reset">Reset sample</button></div></div><main class="board single" id="board"></main><p class="footer">One continuous feed · Original app unchanged</p><script src="art.js"></script><script>
const titles={anime:['Attack on Titan','Demon Slayer','Jujutsu Kaisen','Death Note'],manga:['Chainsaw Man','Solo Leveling','Jujutsu Kaisen','Berserk']};
const fixture={anime:{current:[{id:1,n:3,max:5},{id:0,n:7,max:8},{id:2,n:6,max:9},{id:3,n:11,max:11}],days:[{label:'Tomorrow',items:[{id:1,label:'Episode 6',time:'18:00'},{id:0,label:'Episode 9',time:'19:30'},{id:2,label:'Episode 10',time:'21:00'}]},{label:'Later this week',items:[{id:3,label:'Episode 12',time:'Friday'},{id:1,label:'Episode 7',time:'Sunday'}]}],fresh:[{id:2,label:'New season'},{id:3,label:'New adaptation'}]},manga:{current:[{id:0,n:24},{id:1,n:8},{id:2,n:16},{id:3,n:12}],days:[{label:'This month',items:[{id:0,label:'Next volume',time:'English'},{id:1,label:'Next volume',time:'English'},{id:2,label:'New edition',time:'English'}]},{label:'Announced',items:[{id:3,label:'Collected edition',time:'English'},{id:0,label:'Art book',time:'English'}]}],fresh:[{id:2,label:'New series edition'},{id:3,label:'Deluxe edition'},{id:1,label:'New volume'}]}};
let state=structuredClone(fixture),medium='anime',compare=false,expanded={anime:null,manga:null},saved=new Set(),following={anime:new Set([0,1,2,3]),manga:new Set([0,1,2,3])},language='English',undo=null,timer;try{medium=localStorage.getItem('kuro-home-study-medium')==='manga'?'manga':'anime'}catch{}
const title=(m,i)=>titles[m][i],art=(m,i)=>ART.filter(a=>a.kind===m)[i],img=(m,i,wide=false,cls='')=>`<img class="${cls}" src="${wide?(art(m,i).banner||art(m,i).image):art(m,i).image}" alt="${title(m,i)} artwork" draggable="false">`;
function inline(m,key,i,type){if(expanded[m]!==key)return '';return `<div class="inline">${img(m,i)}<div><strong>${title(m,i)}</strong>${type==='club'?'<p>Mina · Sunday Club<br>“Anyone else still thinking about this?”</p><button data-reveal>Reveal sample spoiler</button>':`<p>${type==='new'?'Illustrative new-release card.':type==='current'?`${m==='anime'?'Watching':'Reading'} · Your progress stays on the card.`:'Sample date, not a verified release.'}</p><button data-follow="${i}">${following[m].has(i)?'Unfollow updates':'Follow updates'}</button>`}</div><button class="close" data-close aria-label="Close expanded title">×</button></div>`}
function current(m){return `<div class="heading"><h1>${m==='anime'?'Watching':'Reading'}</h1><small>${state[m].current.length} in progress</small></div><div class="current-grid">${state[m].current.map((r,index)=>`<article class="tile ${m==='anime'&&!art(m,r.id).banner?'portrait-only':''}"><button class="art-button" data-expand="current-${r.id}" data-id="${r.id}" data-type="current" aria-expanded="${expanded[m]===`current-${r.id}`}" aria-label="More about ${title(m,r.id)}">${img(m,r.id,m==='anime','active-image')}${m==='anime'&&r.max>r.n?`<span class="availability">${r.max-r.n} new</span>`:''}</button><strong class="title">${title(m,r.id)}</strong><div class="tracking"><span class="count">${m==='anime'?'Ep.':'Ch.'} ${r.n}</span><button class="plus" data-progress="${r.id}" ${r.max&&r.n>=r.max?'disabled':''} aria-label="Mark next ${m==='anime'?'episode':'chapter'} of ${title(m,r.id)} complete">${r.max&&r.n>=r.max?'✓':'+'}</button></div>${[2,3].includes(r.id)?`<button class="club-peek" data-expand="club-${r.id}" data-id="${r.id}" data-type="club" aria-label="Club note on ${title(m,r.id)}"><span class="avatar">M</span>Club note</button>`:''}</article>${inline(m,`current-${r.id}`,r.id,'current')}${inline(m,`club-${r.id}`,r.id,'club')}`).join('')}</div>`}
function upcoming(m){let groups=state[m].days.map(d=>({...d,items:d.items.filter(r=>following[m].has(r.id)&&(m==='anime'||language==='English'))})).filter(d=>d.items.length);return `<section class="schedule"><div class="heading"><h2>${m==='anime'?'Coming up':'On paper'}</h2>${m==='anime'?'<small>From your follows</small>':`<select class="language" data-language aria-label="Edition language">${['English','German'].map(l=>`<option ${language===l?'selected':''}>${l}</option>`).join('')}</select>`}</div>${groups.length?groups.map((d,day)=>`<div class="day"><div class="day-label">${d.label}<small>${d.items.length} releases</small></div><div class="release-grid">${d.items.map((r,index)=>{let key=`release-${day}-${index}`;return `<article class="release"><button class="art-button" data-expand="${key}" data-id="${r.id}" data-type="release" aria-expanded="${expanded[m]===key}" aria-label="${title(m,r.id)}, ${r.label}, ${d.label}">${img(m,r.id)}<span class="time-stamp">${r.time}</span></button><strong class="title">${title(m,r.id)}</strong><div class="release-meta"><span>${r.label}</span></div></article>${inline(m,key,r.id,'release')}`}).join('')}</div></div>`).join(''):'<p class="empty">No matching release dates in this sample.</p>'}</section>`}
function fresh(m){return `<section class="new-section"><div class="heading"><h2>New releases</h2><small>${m==='anime'?'Seasons & premieres':'Volumes & editions'}</small></div><div class="new-grid">${state[m].fresh.map((r,index)=>{let key=`new-${index}`,saveKey=`${m}-${index}`;return `<article class="new-card"><button class="art-button" data-expand="${key}" data-type="new" data-id="${r.id}" aria-label="Explore ${title(m,r.id)} ${r.label}">${img(m,r.id,m==='anime')}<span class="tag">New</span></button><div class="new-footer"><div><strong class="title">${title(m,r.id)}</strong><small>${r.label}</small></div><button class="save-button" data-save="${saveKey}" aria-label="${saved.has(saveKey)?'Unsave':'Save'} ${title(m,r.id)} ${r.label}" aria-pressed="${saved.has(saveKey)}">${saved.has(saveKey)?'✓':'+'}</button></div></article>${inline(m,key,r.id,'new')}`}).join('')}</div></section>`}
function clubs(m){return `<section class="club-section"><div class="heading"><h2>In your club</h2><small>Sunday Club</small></div><div class="club-images">${[2,3].map(i=>`<button class="club-image" data-expand="note-${i}" data-id="${i}" data-type="club" aria-label="Read club note about ${title(m,i)}">${img(m,i,true)}<span>${i===2?(m==='anime'?'“Next watch together?”':'“Next read together?”'):'“That ending…”'}</span><small>${title(m,i)} · Spoiler hidden</small></button>${inline(m,`note-${i}`,i,'club')}`).join('')}</div></section>`}
function phone(m){return `<section><div class="caption"><span>${m==='anime'?'Anime':'Manga'}</span><span>Multiple titles, one scroll</span></div><div class="device ${m}" data-panel="${m}"><div class="status"><span>9:41</span><span>••• ▰</span></div><div class="header"><span class="logo">KURO</span><span class="pager"><i aria-hidden="true">‹</i>HOME<i aria-hidden="true">›</i></span><span class="symbol" aria-hidden="true">k</span></div><div class="scope"><button data-medium="anime" aria-pressed="${m==='anime'}">ANIME</button><button data-medium="manga" aria-pressed="${m==='manga'}">MANGA</button><span>Your Home</span></div><div class="scroll">${current(m)}${upcoming(m)}${fresh(m)}${clubs(m)}<div class="endmark">All updates seen.</div></div></div></section>`}
function render(){const positions={};document.querySelectorAll('[data-panel]').forEach(p=>positions[p.dataset.panel]=p.querySelector('.scroll').scrollTop);let b=document.querySelector('#board');b.className='board'+(compare?'':' single');b.innerHTML=(compare?['anime','manga']:[medium]).map(phone).join('');document.querySelector('#compare').textContent=compare?'Single preview':'Compare mediums';document.querySelectorAll('[data-panel]').forEach(p=>p.querySelector('.scroll').scrollTop=positions[p.dataset.panel]||0)}
function toast(m,text,restore){clearTimeout(timer);undo=restore;document.querySelectorAll('.toast').forEach(t=>t.remove());let el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.innerHTML=`<span>${text}</span><button data-undo>Undo</button>`;document.querySelector(`[data-panel="${m}"]`).append(el);timer=setTimeout(()=>el.remove(),8000)}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let m=b.closest('[data-panel]')?.dataset.panel||medium;if(b.id==='compare'){compare=!compare;render()}else if(b.id==='reset'){state=structuredClone(fixture);saved.clear();following={anime:new Set([0,1,2,3]),manga:new Set([0,1,2,3])};expanded={anime:null,manga:null};language='English';render()}else if(b.dataset.medium){medium=b.dataset.medium;compare=false;try{localStorage.setItem('kuro-home-study-medium',medium)}catch{}render()}else if(b.hasAttribute('data-progress')){let r=state[m].current.find(r=>r.id===Number(b.dataset.progress));if(r.max&&r.n>=r.max)return;let old=r.n;r.n++;render();toast(m,`${m==='anime'?'Episode':'Chapter'} ${r.n} recorded`,()=>r.n=old)}else if(b.hasAttribute('data-save')){let k=b.dataset.save,had=saved.has(k);had?saved.delete(k):saved.add(k);render();toast(m,had?'Removed from saved releases':'Release saved',()=>had?saved.add(k):saved.delete(k))}else if(b.hasAttribute('data-follow')){let i=Number(b.dataset.follow),had=following[m].has(i);had?following[m].delete(i):following[m].add(i);expanded[m]=null;render();toast(m,had?'Release updates removed':'Following release updates',()=>had?following[m].add(i):following[m].delete(i))}else if(b.hasAttribute('data-undo')){undo?.();undo=null;render()}else if(b.dataset.expand){expanded[m]=expanded[m]===b.dataset.expand?null:b.dataset.expand;render()}else if(b.hasAttribute('data-close')){expanded[m]=null;render()}else if(b.hasAttribute('data-reveal')){b.previousElementSibling.textContent='Alex · Sample spoiler revealed. This is placeholder comment content.';b.remove()}});
document.addEventListener('change',e=>{if(e.target.hasAttribute('data-language')){language=e.target.value;expanded.manga=null;render()}});document.addEventListener('keydown',e=>{if(e.key==='Escape'){expanded={anime:null,manga:null};render()}});render();
</script></body></html>
