.scene,.book-stage{touch-action:pan-y}.book-choice[aria-pressed=true]{animation:book-arrive .4s ease both}@keyframes book-arrive{from{opacity:.65;translate:0 9px}to{opacity:1;translate:0 0}}
</style></head><body><div class="lab"><div><strong>KURO / Home in motion</strong><small>Interactive study · Fictional account & releases</small></div><div class="lab-controls"><a href="panels.html">Previous study</a><button id="compare">Compare mediums</button><button id="reset">Reset sample</button></div></div><main class="board single" id="board"></main><p class="footer">Local design exploration · No real account changes</p><script src="art.js"></script><script src="home-profile.js"></script><script>
let remembered='anime';try{remembered=localStorage.getItem('kuro-home-study-medium')==='manga'?'manga':'anime'}catch{}
let account=structuredClone(HOME_FIXTURES.returning),medium=remembered,compare=false,focus={anime:1,manga:0},lens={anime:'progress',manga:'progress'},drawer=null,undo=null,toastTimer;
const names={anime:['Attack on Titan','Demon Slayer','Jujutsu Kaisen','Death Note'],manga:['Chainsaw Man','Solo Leveling','Jujutsu Kaisen','Berserk']},vibes={anime:['Tense. Unpredictable.','Heart and spectacle.','Dark, restless action.','A battle of wits.'],manga:['Brutal. Absurd. Tender.','Relentless momentum.','Dark, restless action.','Beautifully unforgiving.']};
const art=(m,i)=>ART.filter(a=>a.kind===m)[i],row=(m,i)=>account.library[m].find(r=>r.id===i),active=m=>m==='anime'?'Watching':'Reading',unit=m=>m==='anime'?'Episode':'Chapter',name=(m,i)=>names[m][i],follow=(m,i)=>account.follows[m].includes(i),event=(m,i)=>HOME_EVENTS[m].releases.find(e=>e.id===i&&(m==='anime'||e.language===account.mangaLanguage)),club=(m,i)=>account.clubs.find(c=>c.media[m].includes(i)),image=(m,i,wide=false,cls='')=>`<img class="${cls}" src="${wide?(art(m,i).banner||art(m,i).image):art(m,i).image}" alt="${name(m,i)} artwork" draggable="false">`;
function mutate(fn,message){let snapshot=structuredClone(account),oldFocus={...focus};fn();undo=()=>{account=snapshot;focus=oldFocus};render();notify(message)}
function notify(message){clearTimeout(toastTimer);document.querySelectorAll('.toast').forEach(t=>t.remove());const p=document.querySelector(`[data-medium-panel="${medium}"]`)||document.querySelector('.phone');const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.innerHTML=`<span>${message}</span><button data-undo>Undo</button>`;p.append(t);toastTimer=setTimeout(()=>t.remove(),8000)}
function increment(m,i){let r=row(m,i);if(m==='anime'&&r.progress>=HOME_EVENTS.anime.available[i])return;mutate(()=>{r.progress++;r.status=active(m);r.lastUsed='Just now'},`${unit(m)} ${r.progress+1} recorded`)}
function lenses(m){return `<div class="lenses" role="tablist" aria-label="Title context">${[['progress',m==='anime'?'Your place':'Bookmark'],['release',m==='anime'?'What’s next':'Editions'],['club','Your club']].map(([id,t])=>`<button role="tab" data-lens="${id}" aria-selected="${lens[m]===id}">${t}</button>`).join('')}</div><div class="lens-body" role="tabpanel">${lensBody(m)}</div>`}
function lensBody(m){let i=focus[m],r=row(m,i),e=event(m,i),c=club(m,i);if(lens[m]==='release')return e?`<div class="lens-split"><div><h3 class="lens-head">${e.when}</h3><p class="lens-sub">${e.label}${e.language?' · '+e.language:''}${e.detail?' · '+e.detail:''}</p></div><button class="quiet-action" data-follow="${i}">${follow(m,i)?'Following ✓':'+ Follow'}</button></div>`:`<h3 class="lens-head">Nothing announced.</h3><p class="lens-sub">${m==='manga'?'No matching edition in this sample.':'No release date in this sample.'}</p><button class="quiet-action" data-follow="${i}">${follow(m,i)?'Following ✓':'+ Follow updates'}</button>`;
if(lens[m]==='club')return c?`<div class="lens-split"><div><h3 class="lens-head">${c.name}</h3><p class="lens-sub">${c.notes[m]===i?'A note on your title.':'This is on your club’s shelf.'}</p></div><button class="step" data-drawer="club" data-id="${i}" aria-label="Open club context">↗</button></div>`:`<h3 class="lens-head">A quiet corner.</h3><p class="lens-sub">This title isn’t on your shared club shelf.</p>`;
let capped=m==='anime'&&r.progress>=HOME_EVENTS.anime.available[i];if(r.status==='Planned'||r.status==='Paused')return `<div class="lens-split"><div><h3 class="lens-head">${r.status==='Paused'?`Chapter ${r.progress}`:'Waiting for you.'}</h3><p class="lens-sub">${r.status==='Paused'?'Your bookmark is still here.':'Saved to your list.'}</p></div><button class="small-action" data-start="${i}">${r.status==='Paused'?'Resume':m==='anime'?'Start watching':'Start reading'} ↗</button></div>`;if(r.status==='Finished')return `<div class="lens-split"><div><h3 class="lens-head">Finished.</h3><p class="lens-sub">${vibes[m][i]}</p></div><button class="quiet-action" data-drawer="detail" data-id="${i}">Your entry ↗</button></div>`;
return `<div class="progress-line"><div class="progress-number">${m==='anime'?'Ep.':'Ch.'} ${r.progress}<small>${r.lastUsed}</small></div><div class="info">${m==='anime'?(capped?'You’re caught up.':`${HOME_EVENTS.anime.available[i]-r.progress} episode${HOME_EVENTS.anime.available[i]-r.progress===1?'':'s'} waiting`):'A little further.'}</div><button class="step solid" data-progress="${i}" ${capped?'disabled':''} aria-label="Mark ${unit(m).toLowerCase()} ${r.progress+1} of ${name(m,i)} complete">${capped?'✓':'+'}</button></div>${m==='anime'?`<div class="progress-track" aria-hidden="true"><span style="width:${Math.min(100,r.progress/HOME_EVENTS.anime.available[i]*100)}%"></span></div>`:''}`}
function anime(){let m='anime',i=focus[m],r=row(m,i),upcoming=HOME_EVENTS.anime.releases.filter(e=>follow(m,e.id));return `<div class="greeting"><h1>A little escape.</h1><small>${account.library.anime.filter(r=>r.status==='Watching').length} in progress<br>Your evening, open.</small></div><div class="scene ${art(m,i).banner?'':'cover-only'}"><button data-drawer="detail" data-id="${i}" aria-label="Open ${name(m,i)}">${image(m,i,true)}</button><span class="scene-label">${r.status==='Watching'?'In your rotation':r.status==='Planned'?'Saved for later':'From your collection'}</span><div class="scene-caption"><strong>${name(m,i)}</strong><small>${vibes[m][i]}</small></div><button class="scene-next" data-next aria-label="Next title">→</button></div><div class="filmstrip" aria-label="Your anime rotation">${[1,0,2,3].map(j=>`<button data-focus="${j}" aria-label="Focus ${name(m,j)}" aria-pressed="${i===j}">${image(m,j,true)}</button>`).join('')}<span class="hint">Your rotation</span></div>${lenses(m)}<div class="section-line"><h2>On the horizon.</h2><small>Your follows</small></div>${upcoming.length?upcoming.map(e=>`<button class="rendezvous" data-event="${e.id}"><span class="date">${e.when==='Tomorrow'?'Tmrw.':'Later.'}<small>${e.detail||'Announced'}</small></span><span class="event">${image(m,e.id)}<span><strong>${name(m,e.id)}</strong><small>${e.label}</small></span><span class="arrow">↗</span></span></button>`).join(''):'<p class="blank" style="margin:0 22px">No updates for your follows.</p>'}<div class="connections"><button class="connection saved" data-focus="2">${image(m,2)}<span><strong>Still curious?</strong><small>${row(m,2).status==='Planned'?'Your saved pick':'On your list'} ↗</small></span></button><button class="connection club" data-drawer="club" data-id="3">${image(m,3,true)}<strong>Worth a rewatch?</strong><small>Sunday Club · Death Note ↗</small></button></div>`}
function manga(){let m='manga',i=focus[m],others=[0,1,2,3].filter(j=>j!==i),upcoming=HOME_EVENTS.manga.releases.filter(e=>follow(m,e.id)&&e.language===account.mangaLanguage);return `<div class="greeting"><h1>Between pages.</h1><small>Your books.<br>Your own pace.</small></div><div class="book-stage" aria-label="Your manga shelf">${[...others,i].map(j=>`<button class="book-choice ${j===i?'':others.indexOf(j)===0?'left':others.indexOf(j)===1?'right':'far'}" aria-label="Open bookmark for ${name(m,j)}" aria-pressed="${j===i}" data-focus="${j}">${image(m,j)}${j===i?'<span class="bookmark" aria-hidden="true"></span>':''}</button>`).join('')}</div><div class="book-title"><div><h2>${name(m,i)}</h2><small>${vibes[m][i]}</small></div><button data-drawer="detail" data-id="${i}" aria-label="Open ${name(m,i)} details">↗</button></div>${lenses(m)}<div class="section-line"><h2>Next on paper.</h2><select class="language" aria-label="Edition language" data-language>${['English','German'].map(l=>`<option ${account.mangaLanguage===l?'selected':''}>${l}</option>`).join('')}</select></div><div class="edition-desk">${upcoming.length?upcoming.map(e=>`<button class="edition" data-event="${e.id}">${image(m,e.id)}<span><strong>${e.when}</strong><small>${e.label}<br>${name(m,e.id)}</small></span></button>`).join(''):'<span class="lens-sub">No matching editions announced in this sample.</span>'}</div><button class="margin-quote" data-drawer="club" data-id="3"><span><small>In the margins · Sunday Club</small><p>“One chapter<br>becomes five.”</p><small>On Berserk · Reveal the conversation ↗</small></span>${image(m,3)}</button>`}
function phone(m){return `<section><div class="frame-label"><span>${m==='anime'?'Anime / Scenes':'Manga / Open shelf'}</span><span>Same Home. Different rhythm.</span></div><div class="phone ${m}" data-medium-panel="${m}"><div class="status"><span>9:41</span><i class="camera"></i><span>••• ▰</span></div><header><span class="brand">KURO</span><div class="home-window"><span aria-hidden="true">‹</span> HOME <span aria-hidden="true">›</span></div><button class="library-button" data-drawer="list" aria-label="Open your list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 5v14M10 5v14M16 5l4 14"/></svg></button></header><div class="scope"><button data-medium="anime" aria-pressed="${m==='anime'}">ANIME</button><button data-medium="manga" aria-pressed="${m==='manga'}">MANGA</button><span class="summary">Your private space</span></div><div class="scroll">${m==='anime'?anime():manga()}<div class="library-doors"><button data-drawer="list">Your collection ↗</button><button data-drawer="context">Why these titles?</button></div></div></div></section>`}
function render(){const scrolls={};document.querySelectorAll('.phone').forEach(p=>scrolls[p.dataset.mediumPanel]=p.querySelector('.scroll').scrollTop);const board=document.querySelector('#board');board.className='board'+(compare?'':' single');board.innerHTML=(compare?['anime','manga']:[medium]).map(phone).join('');document.querySelector('#compare').textContent=compare?'Single preview':'Compare mediums';document.querySelectorAll('.phone').forEach(p=>p.querySelector('.scroll').scrollTop=scrolls[p.dataset.mediumPanel]||0);if(drawer)drawDrawer()}
function drawDrawer(){document.querySelectorAll('.drawer').forEach(d=>d.remove());let {m,i,type}=drawer,r=row(m,i),e=event(m,i),c=club(m,i),body='';if(type==='list')body=`<h2>Your collection.</h2>${account.library[m].map(r=>`<button class="list-row" data-select="${r.id}">${image(m,r.id)}<span><strong>${name(m,r.id)}</strong><small>${r.status} · ${unit(m)} ${r.progress}</small></span><span>↗</span></button>`).join('')}`;
else if(type==='context')body='<h2>Made from your list.</h2><p>The artwork comes from titles this sample member is watching, reading, saving or revisiting. Release cards use followed titles; manga editions also respect language. Club notes come only from a shared club.</p><p>This is a fictional account. Dates and activity are illustrative. Nothing changes your real Kuro account.</p>';
else if(type==='club')body=`${image(m,i,true,'detail-image')}<h2>${name(m,i)}</h2><p>${c?c.name:'No shared club context'}</p>${c&&c.notes[m]===i?`<div class="comment"><small>Mina · ${c.name}</small><blockquote>${m==='anime'?'Worth a rewatch?':'One chapter becomes five.'}</blockquote></div><div class="comment"><small>Alex · Spoiler hidden</small><p data-spoiler-copy>Open only when you’re ready.</p><button class="small-action" data-spoiler>Reveal sample spoiler</button></div>`:c?'<p>On the shared shelf. No sample comments for this title yet.</p>':''}`;
else body=`${image(m,i,!!art(m,i).banner,'detail-image'+(art(m,i).banner?'':' portrait'))}<h2>${name(m,i)}</h2><p class="vibe">${vibes[m][i]}</p>${type==='event'&&e?`<p>${e.when} · ${e.label}${e.language?' · '+e.language:''}. Fictional release example.</p>`:''}<div class="status-options">${['Planned',active(m),'Paused','Finished'].map(s=>`<button data-status="${s}" aria-pressed="${r.status===s}">${s}</button>`).join('')}</div><p>${unit(m)} ${r.progress} recorded</p><button class="small-action" data-follow="${i}">${follow(m,i)?'Following release updates ✓':'+ Follow release updates'}</button>${c?`<button class="list-row" data-drawer="club" data-id="${i}"><span>${c.name}</span><span>↗</span></button>`:''}`;
const d=document.createElement('section');d.className='drawer';d.setAttribute('role','dialog');d.setAttribute('aria-label',type==='list'?'Your collection':type==='context'?'Personal context':type==='club'?'Club conversation':name(m,i));d.innerHTML=`<div class="drawer-head"><span>${type==='club'?'CLUB NOTES':type==='list'?'COLLECTION':m.toUpperCase()}</span><button data-close aria-label="Close panel">×</button></div>${body}`;document.querySelector(`[data-medium-panel="${m}"]`).append(d);d.querySelector('[data-close]').focus({preventScroll:true})}
document.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;let m=b.closest('[data-medium-panel]')?.dataset.mediumPanel||medium;medium=m;if(b.id==='compare'){compare=!compare;drawer=null;render();return}if(b.id==='reset'){account=structuredClone(HOME_FIXTURES.returning);focus={anime:1,manga:0};lens={anime:'progress',manga:'progress'};drawer=null;undo=null;render();return}if(b.hasAttribute('data-undo')){undo?.();undo=null;render();return}if(b.dataset.medium){medium=b.dataset.medium;try{localStorage.setItem('kuro-home-study-medium',medium)}catch{}compare=false;drawer=null;render();return}if(b.hasAttribute('data-focus')||b.hasAttribute('data-next')){focus[m]=b.hasAttribute('data-next')?([1,0,2,3][([1,0,2,3].indexOf(focus[m])+1)%4]):Number(b.dataset.focus);lens[m]='progress';render();return}if(b.dataset.lens){lens[m]=b.dataset.lens;render();return}if(b.hasAttribute('data-progress')){increment(m,Number(b.dataset.progress));return}if(b.hasAttribute('data-start')){let i=Number(b.dataset.start);mutate(()=>{row(m,i).status=active(m);row(m,i).lastUsed='Just now'},'Back in your rotation');return}if(b.hasAttribute('data-follow')){let i=Number(b.dataset.follow),had=follow(m,i);mutate(()=>account.follows[m]=had?account.follows[m].filter(j=>j!==i):[...account.follows[m],i],had?'Unfollowed release updates':'Following release updates');return}if(b.dataset.status){mutate(()=>row(m,drawer.i).status=b.dataset.status,'List updated');return}if(b.hasAttribute('data-select')){focus[m]=Number(b.dataset.select);lens[m]='progress';drawer=null;render();return}if(b.hasAttribute('data-close')){drawer=null;b.closest('.drawer').remove();return}if(b.hasAttribute('data-spoiler')){b.parentElement.querySelector('small').textContent='Alex · Spoiler revealed';b.previousElementSibling.textContent='This sample comment contains a story spoiler. Real comments would appear here.';b.remove();return}if(b.dataset.drawer||b.hasAttribute('data-event')){drawer={m,i:Number(b.dataset.id||b.dataset.event||focus[m]),type:b.dataset.drawer||'event'};drawDrawer()}});
document.addEventListener('change',ev=>{if(ev.target.hasAttribute('data-language')){account.mangaLanguage=ev.target.value;render()}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&drawer){drawer=null;document.querySelector('.drawer')?.remove()}if(ev.target.closest('.lenses')&&(ev.key==='ArrowRight'||ev.key==='ArrowLeft')){ev.preventDefault();let m=ev.target.closest('[data-medium-panel]').dataset.mediumPanel,ids=['progress','release','club'];lens[m]=ids[(ids.indexOf(lens[m])+(ev.key==='ArrowRight'?1:2))%3];render();document.querySelector(`[data-medium-panel="${m}"] [data-lens="${lens[m]}"]`).focus()}if(ev.target.closest('.filmstrip,.book-stage')&&(ev.key==='ArrowRight'||ev.key==='ArrowLeft')){ev.preventDefault();let m=ev.target.closest('[data-medium-panel]').dataset.mediumPanel;focus[m]=(focus[m]+(ev.key==='ArrowRight'?1:3))%4;render();document.querySelector(`[data-medium-panel="${m}"] [data-focus="${focus[m]}"]`).focus()}});
let pointer=null;document.addEventListener('pointercancel',()=>pointer=null);document.addEventListener('pointerdown',e=>{if(e.target.closest('.scene,.book-stage'))pointer={x:e.clientX,y:e.clientY,m:e.target.closest('[data-medium-panel]').dataset.mediumPanel}});document.addEventListener('pointerup',e=>{if(!pointer)return;let p=pointer;pointer=null;let dx=e.clientX-p.x,dy=e.clientY-p.y;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.5){focus[p.m]=(focus[p.m]+(dx<0?1:3))%4;lens[p.m]='progress';render()}});render();
</script></body></html>
