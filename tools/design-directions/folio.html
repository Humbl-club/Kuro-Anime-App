<header class="lab"><div><strong>KURO / Home</strong><p>Interactive study · All activity and release details are samples</p></div><div class="scenarios" aria-label="Preview state"><button data-state="returning" aria-pressed="true">Returning</button><button data-state="caught" aria-pressed="false">Caught up</button><button data-state="new" aria-pressed="false">New here</button></div></header>
<main class="canvas" id="canvas"></main><footer class="footer"><span>Local prototype · App unchanged</span><a href="panels.html">New: Panels ↗</a></footer>
<script src="art.js"></script><script>
const check='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="m3 8 3 3 7-7"/></svg>';
const spark='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" aria-hidden="true"><path d="m8 1 1.5 5.5L15 8l-5.5 1.5L8 15 6.5 9.5 1 8l5.5-1.5Z"/></svg>';
const titles={anime:['Attack on Titan','Demon Slayer','Jujutsu Kaisen','Death Note'],manga:['Chainsaw Man','Solo Leveling','Jujutsu Kaisen','Berserk']};
const vibes={anime:['Tense. Unpredictable.','Heart and spectacle.','Dark, restless action.','A battle of wits.'],manga:['Brutal. Absurd. Tender.','Relentless momentum.','Dark, restless action.','Beautifully unforgiving.']};
let scenario='returning',panels=[{medium:'anime',page:'home',focus:0},{medium:'manga',page:'home',focus:0}],progress={anime:[7,3],manga:[24,8]},saved=new Set(),statuses={},overlay=null,timer,switching=null,recorded=null,gesture=null,suppressClickUntil=0;
const title=(m,i)=>titles[m][i], unit=m=>m==='anime'?'Episode':'Chapter', short=m=>m==='anime'?'ep.':'ch.', key=(m,i)=>m+i;
function img(m,i,cls=''){let a=ART.filter(x=>x.kind===m)[i];return `<img src="${a.image}" alt="${a.title} cover" class="${cls}" draggable="false">`}
function banner(m,i,cls='scene'){let a=ART.filter(x=>x.kind===m)[i];return `<img src="${a.banner||a.image}" alt="${a.title} artwork" class="${cls}" draggable="false">`}
function actions(m,i){let n=progress[m][i];return `<button class="mark" data-progress="${i}" aria-label="Mark ${unit(m).toLowerCase()} ${n+1} complete">${check} Mark ${short(m)} ${n+1}</button>`}
function current(m,id){let i=panels[id].focus,other=1-i,n=progress[m][i],ready=n<(m==='anime'?[8,4][i]:[25,9][i]);return `<div class="section-line"><span>Continue</span><button data-library>My list ↗</button></div><div class="current ${switching===id?'switching':''}"><div class="art-stage" tabindex="0" role="group" aria-label="Current titles. Swipe or use left and right arrow keys to switch."><button class="scene-button" data-open="${i}" aria-label="Open ${title(m,i)}">${banner(m,i)}</button></div><div class="now-heading"><button class="cover-seal" data-open="${i}" aria-label="Open ${title(m,i)}">${img(m,i)}</button><button class="title-open" data-open="${i}"><h1>${title(m,i)}</h1></button><button class="detail-arrow" data-open="${i}" aria-label="Open ${title(m,i)} details">↗</button></div><div class="now-actions"><div><p class="where">${unit(m)} ${n}</p><p class="available">${ready?spark:check}${ready?(m==='anime'?'New episode':'Next chapter'):'Up to date'}</p></div>${actions(m,i)}</div></div><div class="second"><button class="thumb-switch" data-focus="${other}" aria-label="Switch to ${title(m,other)}">${banner(m,other,'thumb')}</button><button class="second-title" data-focus="${other}"><span>${title(m,other)}<small>${unit(m)} ${progress[m][other]}</small></span><span class="switch-arrow" aria-hidden="true">⇄</span></button><button class="quick" data-progress="${other}" aria-label="Mark next ${unit(m).toLowerCase()} of ${title(m,other)} complete">+</button></div>`}

function horizon(m){return `<div class="section-line"><span>On the way</span><span class="sub">From your list</span></div><div class="horizon"><div class="track" aria-hidden="true"></div><div class="moments"><button class="moment" data-release="1"><time>${m==='anime'?'Tomorrow · 18:00':'October · English'}</time>${img(m,1)}<span class="release-copy"><strong>${title(m,1)}</strong><small>${m==='anime'?'Next episode':'Next volume'}</small></span></button><button class="moment" data-release="2"><time>Just announced</time>${img(m,2)}<span class="release-copy"><strong>${title(m,2)}</strong><small>${m==='anime'?'New season':'New edition'}</small></span></button></div></div>`}
function club(m){return `<section class="club"><button class="fan" data-club aria-label="Open Sunday Club activity">${[1,2,3].map(i=>img(m,i)).join('')}</button><button class="club-copy" data-club><span class="club-name">Sunday Club</span><p>“Start this together?”</p><span class="faces"><i>M</i><i>A</i><i>J</i><span>New conversation</span><span class="arrow">↗</span></span></button></section>`}
function tail(){return `<div class="footer-line"><em>Something different?</em><button data-page="taste">Your picks ←</button></div>`}
function caught(m){return `<div class="complete-line"><span class="check" aria-hidden="true">✓</span><div><h1>All caught up.</h1><p>Your next release is below.</p></div></div><div class="done-shelf">${[0,1].map(i=>`<button data-open="${i}">${img(m,i)}<span>${title(m,i)}<small>${unit(m)} ${progress[m][i]}</small></span></button>`).join('')}</div>`}
function empty(m){return `<div class="empty-scene" aria-hidden="true">${[1,3,0].map(i=>img(m,i)).join('')}</div><div class="empty-copy"><h1>Make yourself at home.</h1><p>Start with something you love.</p></div><div class="empty-options"><button class="solid" data-page="taste">Find a title</button><button class="quiet" data-import>Bring my list ↗</button></div><div class="section-line"><span>A place to start</span></div>${taste(m,true)}`}
function taste(m,compact=false){return `<div class="taste-grid">${(compact?[0,3]:[3,2,0,1]).map(i=>`<article class="taste-pick"><button data-open="${i}">${img(m,i)}<h2>${title(m,i)}</h2><p>${vibes[m][i]}</p></button><button class="save" data-save="${i}" aria-label="${saved.has(key(m,i))?'Remove':'Save'} ${title(m,i)}">${saved.has(key(m,i))?'✓':'+'}</button></article>`).join('')}</div>`}
function shell(p,id){let m=p.medium;let body=p.page==='taste'?`<div class="section-line"><span>For you</span></div>${taste(m)}`:scenario==='new'?empty(m):`${scenario==='caught'?caught(m):current(m,id)}${horizon(m)}${club(m)}${tail()}`;return `<section class="frame"><div class="caption"><b>${m==='anime'?'Anime':'Manga'}</b><span>${p.page==='home'?'Home':'Taste'}</span></div><div class="phone ${m} ${recorded===id?'recorded':''}" data-panel="${id}"><div class="status">9:41<span>••• ▰</span></div><nav class="nav"><span class="wordmark">KURO</span><div class="nav-center"><button data-page="taste" aria-label="Open Taste">‹</button><button class="location" data-page="${p.page==='home'?'taste':'home'}">${p.page.toUpperCase()}</button><button data-page="home" aria-label="Open Home">›</button></div><span class="identity" title="Profile is outside this Home study">M</span></nav><div class="scope">${['anime','manga'].map(x=>`<button data-medium="${x}" aria-pressed="${m===x}">${x.toUpperCase()}</button>`).join('')}</div><div class="viewport">${body}</div></div></section>`}
function render(){let scrolls=[...document.querySelectorAll('.viewport')].map(el=>el.scrollTop);document.querySelector('#canvas').innerHTML=panels.map(shell).join('');document.querySelectorAll('.viewport').forEach((el,i)=>el.scrollTop=scrolls[i]||0);document.querySelectorAll('[data-state]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.state===scenario));if(overlay)drawSheet();switching=null;recorded=null}
function toast(id,msg,undo){clearTimeout(timer);document.querySelectorAll('.toast').forEach(el=>el.remove());let el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=msg;if(undo){let b=document.createElement('button');b.textContent='Undo';b.onclick=()=>{undo();render()};el.append(b)}document.querySelector(`[data-panel="${id}"]`).append(el);timer=setTimeout(()=>el.remove(),5000)}
function drawSheet(){document.querySelectorAll('.sheet').forEach(el=>el.remove());let {id,type,i=0}=overlay,m=panels[id].medium,el=document.createElement('section');el.className='sheet';el.setAttribute('role','dialog');el.setAttribute('aria-label',type==='club'?'Sunday Club':type==='library'?'My list':type==='import'?'Import preview':title(m,i));let body='';if(type==='club')body=`<h1>${title(m,3)}</h1><div class="comment"><small>Mina · Sunday Club</small><p>“Start this together?”</p></div><div class="comment"><small>Jules</small><p>“I’m in.”</p></div><div class="comment"><small>Alex · Spoiler</small><button data-reveal>Reveal comment ↗</button></div>`;else if(type==='library')body=`<h1>My list</h1>${[0,1,2,3].filter(i=>i<2||saved.has(key(m,i))).map(i=>`<button class="library-row" data-open="${i}">${img(m,i)}<span><strong>${title(m,i)}</strong><small>${i<2?unit(m)+' '+progress[m][i]:'Planned'}</small></span></button>`).join('')}`;else if(type==='import')body='<h1>Bring your list.</h1><p class="vibe">AniList or MyAnimeList.</p><p>This design preview does not connect to accounts. Import remains part of the existing app workflow.</p>';else if(type==='release')body=`${img(m,i,'detail-image')}<h1>${title(m,i)}</h1><p class="vibe">${i===1?(m==='anime'?'Next episode · Tomorrow at 18:00':'Next English volume · October'):(m==='anime'?'New season announced':'New edition announced')}</p><p>Illustrative release. A real release needs a verified source and ${m==='anime'?'airing / availability distinction':'language and edition'}.</p><button class="club-link" data-open="${i}">Open title ↗</button>`;else body=`${i<2?`${banner(m,i,'detail-scene')}<div class="image-pair">${img(m,i)}<h1>${title(m,i)}</h1></div>`:`${img(m,i,'detail-image')}<h1>${title(m,i)}</h1>`}<p class="vibe">${vibes[m][i]}</p>${i<2&&scenario!=='new'?`<div class="detail-progress">${unit(m)} ${progress[m][i]}<button data-progress="${i}" aria-label="Mark next ${unit(m).toLowerCase()} complete">+</button></div>`:`<div class="detail-actions"><button data-save="${i}" class="${saved.has(key(m,i))?'active':''}">${saved.has(key(m,i))?'✓ Saved':'+ Save to list'}</button></div>`}<div class="detail-actions" style="margin-top:12px">${['Planned',m==='anime'?'Watching':'Reading','Finished'].map(s=>`<button data-status="${s}" class="${(statuses[key(m,i)]||(i<2&&scenario!=='new'?(m==='anime'?'Watching':'Reading'):'Planned'))===s?'active':''}">${s}</button>`).join('')}</div>${scenario!=='new'?'<button class="club-link" data-club>Sunday Club · Notes ↗</button>':''}`;el.innerHTML=`<header><span>${type==='club'?'SUNDAY CLUB':type==='release'?'FROM YOUR LIST':type==='library'?'COLLECTION':m.toUpperCase()}</span><button data-close aria-label="Close panel">×</button></header>${body}`;document.querySelector(`[data-panel="${id}"]`).append(el);el.querySelector('[data-close]').focus({preventScroll:true})}
document.addEventListener('click',e=>{if(performance.now()<suppressClickUntil){e.preventDefault();return}let b=e.target.closest('button');if(!b)return;let id=Number(b.closest('[data-panel]')?.dataset.panel||0),m=panels[id].medium;if(b.dataset.state){scenario=b.dataset.state;panels.forEach(p=>p.page='home');overlay=null;render();document.querySelectorAll('.viewport').forEach(el=>el.scrollTop=0)}else if(b.hasAttribute('data-focus')){panels[id].focus=Number(b.dataset.focus);switching=id;overlay=null;render()}else if(b.dataset.medium){panels[id].medium=b.dataset.medium;overlay=null;render()}else if(b.dataset.page){panels[id].page=b.dataset.page;overlay=null;render();document.querySelector(`[data-panel="${id}"] .viewport`).scrollTop=0}else if(b.hasAttribute('data-progress')){let i=Number(b.dataset.progress),old=progress[m][i];progress[m][i]++;recorded=id;render();toast(id,`${unit(m)} ${progress[m][i]} recorded`,()=>progress[m][i]=old)}else if(b.hasAttribute('data-save')){let k=key(m,b.dataset.save),had=saved.has(k);had?saved.delete(k):saved.add(k);render();toast(id,had?'Removed':'Saved',()=>had?saved.add(k):saved.delete(k))}else if(b.dataset.status){statuses[key(m,overlay.i)]=b.dataset.status;saved.add(key(m,overlay.i));render();toast(id,'List updated')}else if(b.hasAttribute('data-close')){overlay=null;b.closest('.sheet').remove()}else if(b.hasAttribute('data-reveal'))b.replaceWith(document.createTextNode('“That final reveal changes everything.”'));else{let type=b.hasAttribute('data-open')?'detail':b.hasAttribute('data-club')?'club':b.hasAttribute('data-library')?'library':b.hasAttribute('data-release')?'release':b.hasAttribute('data-import')?'import':null;if(type){overlay={id,type,i:Number(b.dataset.open||b.dataset.release||0)};drawSheet()}}});
function switchArtwork(id){panels[id].focus=1-panels[id].focus;switching=id;overlay=null;render();document.querySelector(`[data-panel="${id}"] .art-stage`)?.focus({preventScroll:true})}
document.addEventListener('pointerdown',e=>{let stage=e.target.closest('.art-stage');if(stage)gesture={id:Number(stage.closest('[data-panel]').dataset.panel),x:e.clientX,y:e.clientY}});
document.addEventListener('pointerup',e=>{if(!gesture)return;let g=gesture;gesture=null;let dx=e.clientX-g.x,dy=e.clientY-g.y;if(Math.abs(dx)>48&&Math.abs(dx)>Math.abs(dy)*1.5){suppressClickUntil=performance.now()+350;switchArtwork(g.id)}});
document.addEventListener('pointercancel',()=>gesture=null);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&overlay){overlay=null;document.querySelector('.sheet')?.remove()}else if(['ArrowLeft','ArrowRight'].includes(e.key)&&e.target.closest('.art-stage')){e.preventDefault();switchArtwork(Number(e.target.closest('[data-panel]').dataset.panel))}});render();
</script></body></html>
