</style></head><body>
<header class="lab"><div><strong>KURO / Home</strong><p>Personal Home · Fictional account and release data</p></div><div class="review-controls"><select id="demo-account" aria-label="Sample account"><option value="returning">Sample: returning member</option><option value="new">Sample: new member</option></select><button id="compare" aria-pressed="false">Compare layouts</button></div></header>
<main class="board single" id="board"></main><footer class="footer">Local prototype · Original app unchanged</footer>
<script src="art.js"></script><script src="home-profile.js"></script><script>
const check='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m3 8 3 3 7-7"/></svg>';
const titles={anime:['Attack on Titan','Demon Slayer','Jujutsu Kaisen','Death Note'],manga:['Chainsaw Man','Solo Leveling','Jujutsu Kaisen','Berserk']};
const vibes={anime:['Tense. Unpredictable.','Heart and spectacle.','Dark, restless action.','A battle of wits.'],manga:['Brutal. Absurd. Tender.','Relentless momentum.','Dark, restless action.','Beautifully unforgiving.']};
let selectedMedium='anime';try{selectedMedium=localStorage.getItem('kuro-home-study-medium')==='manga'?'manga':'anime'}catch{}
let profileName='returning',account=structuredClone(HOME_FIXTURES.returning),comparing=false,panels=[{medium:selectedMedium,page:'home',book:0,anime:1}],overlay=null,timer,flash=null;
const title=(m,i)=>titles[m][i],unit=m=>m==='anime'?'Episode':'Chapter',short=m=>m==='anime'?'Ep.':'Ch.',key=(m,i)=>m+i,activeStatus=m=>m==='anime'?'Watching':'Reading';
const asset=(m,i)=>ART.filter(x=>x.kind===m)[i],entry=(m,i)=>account.library[m].find(r=>r.id===i),active=m=>account.library[m].filter(r=>r.status===activeStatus(m)),planned=m=>account.library[m].filter(r=>r.status==='Planned');
function put(m,row){let n=account.library[m].findIndex(r=>r.id===row.id);if(n<0)account.library[m].push(row);else account.library[m][n]=row}
function restore(m,i,old){if(old)put(m,old);else account.library[m]=account.library[m].filter(r=>r.id!==i)}
function saveSnapshot(m,i){let r=entry(m,i);return r?structuredClone(r):null}
function releases(m){return HOME_EVENTS[m].releases.filter(r=>account.follows[m].includes(r.id)&&(m==='anime'||r.language===account.mangaLanguage))}
function unseenEpisodes(){return active('anime').reduce((sum,r)=>sum+Math.max(0,(HOME_EVENTS.anime.newEpisodes[r.id]||0)-r.progress),0)}
function relevantClub(m){return account.clubs.find(c=>entry(m,c.notes[m]))}
function image(m,i,cls='art',wide=false){let a=asset(m,i);return `<img src="${wide?(a.banner||a.image):a.image}" alt="${a.title} ${wide?'artwork':'cover'}" class="${cls}" draggable="false">`}
function canAdvance(m,i){let r=entry(m,i);return r&&r.status!== 'Finished'&&(m==='manga'||r.progress<HOME_EVENTS.anime.available[i])}
function track(m,i){let r=entry(m,i);return `<div class="progress-row"><span class="position">${unit(m)} ${r.progress}</span><button data-progress="${i}" ${canAdvance(m,i)?'':'disabled'} aria-label="Mark next ${unit(m).toLowerCase()} of ${title(m,i)} complete">${flash===key(m,i)?check:'+'}</button></div>`}
function context(m){let a=active(m).length,q=planned(m).length,n=m==='anime'?unseenEpisodes():0;return `<div class="personal-context"><span>${a} ${m==='anime'?'watching':'reading'} · ${q} saved</span><button ${n?'data-updates':'data-context'}>${n?`${n} new episode${n===1?'':'s'}`:'Your context ↗'}</button></div>`}
function queue(m){let r=planned(m)[0];if(!r)return '';let c=account.clubs.find(c=>c.media[m].includes(r.id));return `<section class="queue"><div class="queue-label"><span>${m==='anime'?'From your watchlist':'Saved for later'}</span><small>Saved by you</small></div><div class="queue-body">${image(m,r.id)}<button class="queue-copy" data-open="${r.id}"><strong>${title(m,r.id)}</strong><small>${c?'Also in '+c.name:'In your planned list'}</small></button><button class="queue-start" data-start="${r.id}">Start ${m==='anime'?'watching':'reading'}</button></div></section>`}
function emptyHome(m){return `<section class="empty-home"><div class="empty-art">${image(m,0)}${image(m,2)}${image(m,3)}</div><h1>Start with your list.</h1><p>Save a title to make this Home yours.</p><button data-page="taste">Find something</button></section>`}
function animeHome(id){let rows=active('anime'),main=rows.find(r=>r.id===panels[id].anime)||rows[0],n=main?.progress,i=main?.id;let upcoming=releases('anime'),club=relevantClub('anime');if(!account.library.anime.length)return emptyHome('anime');return `<section class="anime-home">${context('anime')}${main?`<div class="anime-label"><span>Continue watching</span><small>${Math.max(0,(HOME_EVENTS.anime.newEpisodes[i]||0)-n)>0?'New episode':n===0?'Ready to start':'Your progress'}</small></div><div class="watching-screen ${asset('anime',i).banner?'':'cover-only'}"><button class="scene-button" data-open="${i}" aria-label="Open ${title('anime',i)}">${image('anime',i,'scene',!!asset('anime',i).banner)}</button><div class="screen-caption"><button class="show-title" data-open="${i}"><h1>${title('anime',i)}</h1><small>${n?`Episode ${n} watched`:'Not started yet'}</small></button><button class="watch-check" data-progress="${i}" ${canAdvance('anime',i)?'':'disabled'} aria-label="Mark episode ${n+1} of ${title('anime',i)} complete">${flash===key('anime',i)?check:canAdvance('anime',i)?'+':'✓'}</button></div></div>${rows.filter(r=>r.id!==i).slice(0,2).map(r=>`<div class="film-next"><button class="film-frame" data-focus="${r.id}" aria-label="Continue ${title('anime',r.id)}">${image('anime',r.id,'',!!asset('anime',r.id).banner)}</button><button class="other-title" data-focus="${r.id}">${title('anime',r.id)}<small>Episode ${r.progress} · ${r.lastUsed||'In progress'}</small></button><button class="quick" data-progress="${r.id}" ${canAdvance('anime',r.id)?'':'disabled'} aria-label="Mark next episode of ${title('anime',r.id)} complete">+</button></div>`).join('')}`:'<p class="catchup-label">Nothing in progress. Your saved titles are below.</p>'}${queue('anime')}${upcoming.length?`<div class="anime-label"><span>Your release radar</span><small>Following</small></div><div class="airing">${upcoming.map(r=>`<button class="airing-item" data-release="${r.id}"><time>${r.when}<strong>${r.detail}</strong></time><span class="airing-card">${image('anime',r.id)}<span><strong>${title('anime',r.id)}</strong><small>${r.label}</small></span></span></button>`).join('')}</div>`:''}${club?`<div class="watch-club"><button data-club aria-label="Open Sunday Club notes for Death Note">${image('anime',club.notes.anime,'',true)}<span class="conversation">Watching this together?<span>↗</span></span></button><div class="club-name"><b>${club.name}</b><span>${entry('anime',club.notes.anime).status==='Finished'?'You finished this':'On your list'} · New note</span></div></div>`:''}<div class="taste-door"><em>Something different?</em><button data-page="taste">Your picks ←</button></div></section>`}
function mangaHome(id){let rows=active('manga'),main=rows.find(r=>r.id===panels[id].book)||rows[0],i=main?.id,n=main?.progress,upcoming=releases('manga'),paused=account.library.manga.find(r=>r.status==='Paused'),club=relevantClub('manga');if(!account.library.manga.length)return emptyHome('manga');return `<section class="manga-home">${context('manga')}${main?`<div class="manga-label"><span>Your bookmark</span><small>${main.lastUsed||'Reading'}</small></div><div class="book-desk"><button class="book-cover" data-open="${i}" aria-label="Open ${title('manga',i)}">${image('manga',i)}</button><div class="reading-leaf ${flash===key('manga',i)?'turn':''}"><span class="ribbon" aria-hidden="true"></span><button data-open="${i}"><h1>${title('manga',i)}</h1></button><p class="chapter">${n?`At <strong>chapter ${n}</strong>`:'Ready to begin'}</p><button class="chapter-mark" data-progress="${i}" aria-label="Mark chapter ${n+1} of ${title('manga',i)} complete">${check} Mark chapter ${n+1}</button></div></div>${rows.filter(r=>r.id!==i).slice(0,2).map(r=>`<div class="reading-next"><button class="little-book" data-book="${r.id}" aria-label="Move bookmark view to ${title('manga',r.id)}">${image('manga',r.id)}</button><button class="other-title" data-book="${r.id}">${title('manga',r.id)}<small>Chapter ${r.progress} · ${r.lastUsed||'Reading'}</small></button><button class="quick" data-progress="${r.id}" aria-label="Mark next chapter of ${title('manga',r.id)} complete">+</button></div>`).join('')}`:'<p class="catchup-label">No book open. Start a saved title below.</p>'}${queue('manga')}<div class="manga-label"><span>Your editions</span><select class="language-control" data-language aria-label="Preferred manga edition language">${['English','German'].map(l=>`<option ${l===account.mangaLanguage?'selected':''}>${l}</option>`).join('')}</select></div>${upcoming.length?`<div class="editions">${upcoming.map(r=>`<button class="edition-slip" data-release="${r.id}">${image('manga',r.id)}<span><time>${r.when}</time><strong>${title('manga',r.id)}</strong><small>${r.label}</small></span></button>`).join('')}</div>`:`<p class="no-dates">No ${account.mangaLanguage} dates for your follows yet.</p>`}${paused?`<div class="paused-title">${image('manga',paused.id)}<span class="paused-info"><strong>${title('manga',paused.id)}</strong><small>Paused · Ch. ${paused.progress} · ${paused.lastUsed}</small></span><button data-start="${paused.id}">Resume</button></div>`:''}${club?`<div class="margin-note"><button data-club><small>Mina · ${club.name}</small><p>One chapter becomes five.</p><span class="source">${title('manga',club.notes.manga)} · On your list ↗</span></button><button class="note-cover" data-club aria-label="Open club notes for Berserk">${image('manga',club.notes.manga)}</button></div>`:''}<div class="taste-door"><em>Your next read?</em><button data-page="taste">Your picks ←</button></div></section>`}
function taste(m){let picks=[2,3,0,1].filter(i=>!entry(m,i));return `<h1 class="taste-title">${account.library[m].length?'Explore beyond your list.':'A place to start.'}</h1>${picks.length?`<div class="taste-spread">${picks.map(i=>`<article class="pick"><button data-open="${i}">${image(m,i)}<h2>${title(m,i)}</h2><p>${vibes[m][i]}</p></button><button class="save" data-save="${i}" aria-label="Save ${title(m,i)}">+</button></article>`).join('')}</div>`:'<p class="empty-section">You already have every title in this small sample catalogue. A real catalogue would supply unseen candidates.</p>'}<p class="taste-note">Sample catalogue · No claimed recommendation engine.</p>`}
function shell(p,id){let m=p.medium;return `<section class="frame"><div class="caption"><span>${m==='anime'?'Anime':'Manga'}</span><span>${p.page==='home'?'Home':'Taste'}</span></div><div class="device ${m}" data-panel="${id}"><div class="status">9:41<span>••• ▰</span></div><nav class="navigation"><span class="wordmark">KURO</span><div class="window"><button data-page="taste" aria-label="Open Taste">‹</button><button class="page" data-page="${p.page==='home'?'taste':'home'}">${p.page.toUpperCase()}</button><button data-page="home" aria-label="Open Home">›</button></div><button class="identity" data-context aria-label="Inspect sample account context">S</button></nav><div class="scope">${['anime','manga'].map(x=>`<button data-medium="${x}" aria-pressed="${m===x}">${x.toUpperCase()}</button>`).join('')}<button class="shelf-link" data-list>My list ↗</button></div><div class="viewport">${p.page==='home'?(m==='anime'?animeHome(id):mangaHome(id)):taste(m)}</div></div></section>`}
function render(){let scrolls=[...document.querySelectorAll('.viewport')].map(x=>x.scrollTop);document.querySelector('#board').innerHTML=panels.map(shell).join('');document.querySelector('#board').classList.toggle('single',!comparing);document.querySelector('#compare').setAttribute('aria-pressed',comparing);document.querySelector('#compare').textContent=comparing?'Single preview':'Compare layouts';document.querySelector('#demo-account').value=profileName;document.querySelectorAll('.viewport').forEach((x,i)=>x.scrollTop=scrolls[i]||0);if(overlay)drawSheet();flash=null}
function toast(id,text,undo){clearTimeout(timer);document.querySelectorAll('.toast').forEach(x=>x.remove());let el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=text;if(undo){let b=document.createElement('button');b.textContent='Undo';b.onclick=()=>{undo();render()};el.append(b)}document.querySelector(`[data-panel="${id}"]`).append(el);timer=setTimeout(()=>el.remove(),4500)}
function listRow(m,r){return `<button class="list-item" data-open="${r.id}">${image(m,r.id)}<span><strong>${title(m,r.id)}</strong><small>${r.status}${r.progress?' · '+unit(m)+' '+r.progress:''}</small></span></button>`}
function drawSheet(){document.querySelectorAll('.sheet').forEach(x=>x.remove());let {id,i=0,type}=overlay,m=panels[id].medium,r=entry(m,i),body='';
 if(type==='club'){let c=relevantClub(m),n=c?.notes[m];body=c?`${image(m,n,'banner',true)}<h1>${title(m,n)}</h1><p class="reason-note">Shown because this title is in your ${entry(m,n).status.toLowerCase()} list and you share ${c.name}.</p><div class="comment"><small>Mina · ${c.name}</small><p>${m==='anime'?'Watching this together?':'One chapter becomes five.'}</p></div><div class="comment"><small>Alex · Spoiler</small><p><button data-reveal>Reveal comment ↗</button></p></div>`:'<h1>No club activity</h1><p class="sub">Only shared-club activity appears here.</p>'}
 else if(type==='list')body=`<h1>My list</h1>${account.library[m].length?account.library[m].map(r=>listRow(m,r)).join(''):'<p class="sub">Your list is empty.</p>'}`;
 else if(type==='updates'){let fresh=active('anime').filter(r=>r.progress<(HOME_EVENTS.anime.newEpisodes[r.id]||0));body=`<h1>Since your last visit</h1>${fresh.length?fresh.map(r=>`<button class="list-item" data-open="${r.id}">${image('anime',r.id)}<span><strong>${title('anime',r.id)}</strong><small>${HOME_EVENTS.anime.newEpisodes[r.id]-r.progress} unwatched new episode · Through ${HOME_EVENTS.anime.newEpisodes[r.id]}</small></span></button>`).join(''):'<p class="sub">You are caught up on these updates.</p>'}`}
 else if(type==='context')body=`<h1>Your context</h1><p class="reason-note">Fictional ${account.label.toLowerCase()}; this is not your live account.</p><table class="personal-table"><tbody><tr><th>Watching / reading</th><td>${active(m).length}</td></tr><tr><th>Saved for later</th><td>${planned(m).length}</td></tr><tr><th>Release follows</th><td>${account.follows[m].map(i=>title(m,i)).join(', ')||'None'}</td></tr><tr><th>Clubs</th><td>${account.clubs.map(c=>c.name).join(', ')||'None'}</td></tr>${m==='manga'?`<tr><th>Edition language</th><td>${account.mangaLanguage}</td></tr>`:''}</tbody></table><p class="reason-note">Home uses list status, progress, follows, language and shared-club context. Missing information stays empty; it is not replaced with invented personal activity.</p>`;
 else if(type==='release'){let event=HOME_EVENTS[m].releases.find(x=>x.id===i);body=`${image(m,i,'cover')}<h1>${title(m,i)}</h1><p class="vibe">${event.label} · ${event.when}${event.language?' · '+event.language:event.detail?' · '+event.detail:''}</p><p class="reason-note">${account.follows[m].includes(i)?`Shown because you follow this title${m==='manga'?' and this edition matches your language':''}.`:'You are no longer following release updates for this title.'} Dates are fictional samples.</p><button class="club-link" data-follow="${i}">${account.follows[m].includes(i)?'Unfollow release updates':'Follow release updates'}</button><button class="club-link" data-open="${i}">Open title ↗</button>`}
 else body=`${image(m,i,asset(m,i).banner?'banner':'cover',!!asset(m,i).banner)}<h1>${title(m,i)}</h1><p class="vibe">${vibes[m][i]}</p>${r&&r.status!=='Planned'?track(m,i):`<button class="save-detail" data-save="${i}">${r?'Remove from plan':'+ Save to list'}</button>`}<div class="statuses">${['Planned',activeStatus(m),'Paused','Finished'].map(x=>`<button data-status="${x}" class="${r?.status===x?'active':''}">${x}</button>`).join('')}</div><button class="club-link" data-follow="${i}">${account.follows[m].includes(i)?'Following releases ✓':'Follow release updates +'}</button>${relevantClub(m)?.notes[m]===i?'<button class="club-link" data-club>Shared club notes ↗</button>':''}`;
 let el=document.createElement('section');el.className='sheet';el.setAttribute('role','dialog');el.setAttribute('aria-label',type==='context'?'Sample account context':type==='list'?'My list':type==='updates'?'New episodes':type==='club'?'Sunday Club':title(m,i));el.innerHTML=`<header><span>${type==='club'?'SUNDAY CLUB':type==='context'?'SAMPLE ACCOUNT':type==='list'?'COLLECTION':m.toUpperCase()}</span><button data-close aria-label="Close panel">×</button></header>${body}`;document.querySelector(`[data-panel="${id}"]`).append(el);el.querySelector('[data-close]').focus({preventScroll:true})
}
function returnToTop(id){document.querySelector(`[data-panel="${id}"] .viewport`).scrollTop=0}
document.addEventListener('change',e=>{if(e.target.id==='demo-account'){profileName=e.target.value;account=structuredClone(HOME_FIXTURES[profileName]);overlay=null;panels.forEach(p=>{p.page='home';p.book=0;p.anime=1});render();panels.forEach((_,id)=>returnToTop(id))}else if(e.target.hasAttribute('data-language')){account.mangaLanguage=e.target.value;render()}});
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let id=Number(b.closest('[data-panel]')?.dataset.panel||0),m=panels[id].medium;
 if(b.id==='compare'){comparing=!comparing;panels=comparing?[{medium:'anime',page:'home',book:0,anime:1},{medium:'manga',page:'home',book:0,anime:1}]:[{medium:selectedMedium,page:'home',book:0,anime:1}];overlay=null;render()}
 else if(b.hasAttribute('data-book')){panels[id].book=Number(b.dataset.book);render()}
 else if(b.hasAttribute('data-focus')){panels[id].anime=Number(b.dataset.focus);render()}
 else if(b.dataset.medium){panels[id].medium=b.dataset.medium;selectedMedium=b.dataset.medium;try{localStorage.setItem('kuro-home-study-medium',selectedMedium)}catch{}overlay=null;render();returnToTop(id)}
 else if(b.dataset.page){panels[id].page=b.dataset.page;overlay=null;render();returnToTop(id)}
 else if(b.hasAttribute('data-progress')){let i=Number(b.dataset.progress);if(!canAdvance(m,i))return;let old=saveSnapshot(m,i),r=entry(m,i);r.progress++;r.lastUsed='Just now';r.status=activeStatus(m);flash=key(m,i);render();toast(id,`${unit(m)} ${r.progress} recorded`,()=>restore(m,i,old))}
 else if(b.hasAttribute('data-start')){let i=Number(b.dataset.start),old=saveSnapshot(m,i),previousFocus=panels[id][m==='anime'?'anime':'book'],r=old||{id:i,progress:0};put(m,{...r,status:activeStatus(m),lastUsed:'Just now'});panels[id][m==='anime'?'anime':'book']=i;render();returnToTop(id);toast(id,m==='anime'?'Moved to watching':'Moved to reading',()=>{restore(m,i,old);panels[id][m==='anime'?'anime':'book']=previousFocus})}
 else if(b.hasAttribute('data-save')){let i=Number(b.dataset.save),old=saveSnapshot(m,i);if(old)restore(m,i,null);else put(m,{id:i,status:'Planned',progress:0,saved:'Just now'});render();toast(id,old?'Removed from your list':'Saved to your plan',()=>restore(m,i,old))}
 else if(b.hasAttribute('data-follow')){let i=Number(b.dataset.follow),had=account.follows[m].includes(i);account.follows[m]=had?account.follows[m].filter(x=>x!==i):[...account.follows[m],i];render();toast(id,had?'Release updates removed':'Following releases',()=>{account.follows[m]=had?[...account.follows[m],i]:account.follows[m].filter(x=>x!==i)})}
 else if(b.dataset.status){let i=overlay.i,old=saveSnapshot(m,i);put(m,{...(old||{id:i,progress:0}),status:b.dataset.status,lastUsed:'Just now'});render();toast(id,'List updated',()=>restore(m,i,old))}
 else if(b.hasAttribute('data-close')){overlay=null;b.closest('.sheet').remove()}
 else if(b.hasAttribute('data-reveal'))b.replaceWith(document.createTextNode('The sample spoiler is now visible.'));
 else{let type=b.hasAttribute('data-open')?'detail':b.hasAttribute('data-club')?'club':b.hasAttribute('data-list')?'list':b.hasAttribute('data-release')?'release':b.hasAttribute('data-context')?'context':b.hasAttribute('data-updates')?'updates':null;if(type){overlay={id,type,i:Number(b.dataset.open||b.dataset.release||0)};drawSheet()}}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&overlay){overlay=null;document.querySelector('.sheet')?.remove()}});render();
</script></body></html>
