</style></head><body><header class="lab"><div><strong>KURO / Three directions</strong><small>Same personal content. Three different compositions.<br>Fictional account and releases.</small></div><div class="controls"><button data-medium="anime" aria-pressed="true">Anime</button><button data-medium="manga" aria-pressed="false">Manga</button><button id="all" hidden>All directions</button><button id="reset">Reset</button></div></header><main class="board" id="board"></main><script src="art.js"></script><script>
const names={anime:['Attack on Titan','Demon Slayer','Jujutsu Kaisen','Death Note'],manga:['Chainsaw Man','Solo Leveling','Jujutsu Kaisen','Berserk']};const directions=[{id:'thread',name:'Thread',label:'An illustrated timeline',note:'Artwork follows a fine vertical line. Personal progress and future releases become one continuous thread.'},{id:'cut',name:'Cut',label:'Edge-to-edge composition',note:'Interlocking artwork with captions cut into the edges. The most image-dense direction.'},{id:'journal',name:'Journal',label:'An illustrated journal',note:'Alternating artwork and compact annotations. Manga becomes an offset contact sheet of full covers.'}];
const requestedDirection=new URLSearchParams(location.search).get('direction');let selected=directions.some(d=>d.id===requestedDirection)?requestedDirection:null,medium='anime',progress={anime:[7,3,6,11],manga:[24,8,16,12]},maximum=[8,5,9,11],saved=new Set(),open={thread:null,cut:null,journal:null},undo=null,timer;const art=(m,i)=>ART.filter(a=>a.kind===m)[i],title=i=>names[medium][i],picture=(i,wide=false)=>`<img src="${wide?(art(medium,i).banner||art(medium,i).image):art(medium,i).image}" alt="${title(i)} artwork" draggable="false">`;
function extra(d,key,i,kind){if(open[d]!==key)return '';return `<div class="inline"><strong>${title(i)}</strong><p>${kind==='club'?'Mina · Sunday Club · “Shall we start this together?”':kind==='current'?`${medium==='anime'?'Episode':'Chapter'} ${progress[medium][i]} recorded. Updates stay attached to this title.`:'Illustrative release date. This is not a verified announcement.'}</p>${kind==='club'?'<button data-reveal>Reveal sample spoiler</button>':''}<button data-close>Close</button></div>`}
function currents(d){return `<div class="chapter-head"><h1>${medium==='anime'?'In rotation.':'Open books.'}</h1><small>4 in progress</small></div><div class="current">${[1,0,2,3].map(i=>{let n=progress[medium][i],cap=medium==='anime'&&n>=maximum[i];return `<article class="watch ${!art(medium,i).banner?'portrait':''}"><button class="image-link" data-open="current-${i}" data-id="${i}" data-kind="current" aria-label="More about ${title(i)}">${picture(i,medium==='anime'&&d!=='journal')}</button>${medium==='anime'&&maximum[i]>n?`<span class="new-flag">${maximum[i]-n} new</span>`:''}<div class="byline"><span><strong class="title">${title(i)}</strong><small class="meta">${medium==='anime'?'Ep.':'Ch.'} ${n}</small></span><button class="plus" data-progress="${i}" aria-label="Mark next ${medium==='anime'?'episode':'chapter'} of ${title(i)} complete" ${cap?'disabled':''}>${cap?'✓':'+'}</button></div></article>${extra(d,`current-${i}`,i,'current')}`}).join('')}</div>`}
function events(d,label,ids){return `<div class="group-head">${label}<small>${ids.length} releases</small></div><div class="events">${ids.map((i,index)=>`<article class="event"><button class="image-link" data-open="${label}-${i}" data-id="${i}" data-kind="release" aria-label="${title(i)}, ${label}">${picture(i)}<time>${medium==='anime'?['18:00','19:30','21:00'][index]:'English'}</time></button><strong class="event-title">${title(i)}</strong><small class="event-meta">${medium==='anime'?'Next episode':'Next volume'}</small></article>${extra(d,`${label}-${i}`,i,'release')}`).join('')}</div>`}
function fresh(d){return `<section class="fresh"><div class="chapter-head"><h2>Just arrived.</h2><small>New releases</small></div><div class="fresh-grid">${[2,3].map(i=>`<article class="fresh-item"><button class="image-link" data-open="new-${i}" data-id="${i}" data-kind="release" aria-label="Explore new ${title(i)} release">${picture(i,medium==='anime')}<span class="new-flag">${medium==='anime'?'New season':'New edition'}</span></button><div class="byline"><strong class="event-title">${title(i)}</strong><button class="save" data-save="${i}" aria-label="${saved.has(medium+i)?'Unsave':'Save'} ${title(i)} release" aria-pressed="${saved.has(medium+i)}">${saved.has(medium+i)?'✓':'+'}</button></div></article>${extra(d,`new-${i}`,i,'release')}`).join('')}</div></section>`}
function phone(d){return `<section class="direction"><div class="direction-label"><strong>${d.name}</strong><button data-inspect="${d.id}" aria-label="Inspect ${d.name} at phone size">${d.label} ↗</button></div><div class="device ${d.id} ${medium}" data-direction="${d.id}"><div class="status"><span>9:41</span><span>••• ▰</span></div><div class="header"><span class="wordmark">KURO</span><span class="nav"><i aria-hidden="true">‹</i>HOME<i aria-hidden="true">›</i></span><span class="profile" aria-hidden="true">k</span></div><div class="scope"><span>${medium.toUpperCase()}</span><span>Your private space</span></div><div class="scroll">${currents(d.id)}${events(d.id,medium==='anime'?'Tomorrow':'This month',[1,0,2])}${events(d.id,medium==='anime'?'Later this week':'Announced',[3,1])}${fresh(d.id)}<section class="club"><button data-open="club-3" data-id="3" data-kind="club" aria-label="Read Sunday Club note">${picture(3,true)}<blockquote>${medium==='anime'?'“One more episode?”':'“One chapter became five.”'}</blockquote><small>Sunday Club · ${title(3)} ↗</small></button>${extra(d.id,'club-3',3,'club')}</section><div class="end">All caught up with your updates.</div></div></div><p class="note">${d.note}</p></section>`}
function render(){let positions={};document.querySelectorAll('[data-direction]').forEach(p=>positions[p.dataset.direction]=p.querySelector('.scroll').scrollTop);document.querySelector('#board').className='board'+(selected?' single':'');document.querySelector('#board').innerHTML=directions.filter(d=>!selected||selected===d.id).map(phone).join('');document.querySelector('#all').hidden=!selected;document.querySelectorAll('[data-direction]').forEach(p=>p.querySelector('.scroll').scrollTop=positions[p.dataset.direction]||0);document.querySelectorAll('[data-medium]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.medium===medium))}
function notify(d,message,restore){clearTimeout(timer);undo=restore;document.querySelectorAll('.toast').forEach(t=>t.remove());let t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.innerHTML=`<span>${message}</span><button data-undo>Undo</button>`;document.querySelector(`[data-direction="${d}"]`).append(t);timer=setTimeout(()=>t.remove(),8000)}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let d=b.closest('[data-direction]')?.dataset.direction||'thread';if(b.dataset.inspect){selected=b.dataset.inspect;render()}else if(b.id==='all'){selected=null;render()}else if(b.dataset.medium){medium=b.dataset.medium;open={thread:null,cut:null,journal:null};render();document.querySelectorAll('.scroll').forEach(s=>s.scrollTop=0)}else if(b.id==='reset'){progress={anime:[7,3,6,11],manga:[24,8,16,12]};saved.clear();open={thread:null,cut:null,journal:null};undo=null;render()}else if(b.hasAttribute('data-progress')){let i=Number(b.dataset.progress),m=medium,old=progress[m][i];if(m==='anime'&&old>=maximum[i])return;progress[m][i]++;render();notify(d,`${m==='anime'?'Episode':'Chapter'} ${old+1} recorded`,()=>progress[m][i]=old)}else if(b.hasAttribute('data-save')){let k=medium+b.dataset.save,had=saved.has(k);had?saved.delete(k):saved.add(k);render();notify(d,had?'Release unsaved':'Release saved',()=>had?saved.add(k):saved.delete(k))}else if(b.hasAttribute('data-undo')){undo?.();undo=null;render()}else if(b.dataset.open){open[d]=open[d]===b.dataset.open?null:b.dataset.open;render()}else if(b.hasAttribute('data-close')){open[d]=null;render()}else if(b.hasAttribute('data-reveal')){b.previousElementSibling.textContent='Sample spoiler revealed. Real club comments would appear here.';b.remove()}});document.addEventListener('keydown',e=>{if(e.key==='Escape'){open={thread:null,cut:null,journal:null};render()}});render();
</script></body></html>
