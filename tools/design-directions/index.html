<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kuro — Three editorial directions</title>
<style>
:root{--paper:#f7f6f2;--ink:#20211f;--muted:#70716c;--rule:#cccdc6}*{box-sizing:border-box}body{margin:0;background:#e9e9e3;color:var(--ink);font:14px Arial,Helvetica,sans-serif}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid #606d56;outline-offset:4px}button{border:0;background:none;padding:0}header.lab{max-width:1440px;margin:auto;padding:32px 32px 20px;display:flex;justify-content:space-between;gap:25px;align-items:end}.lab h1{font:38px Georgia;margin:6px 0 8px;letter-spacing:-1.3px}.eyebrow{font-size:10px;letter-spacing:1.7px;text-transform:uppercase}.lab p{color:#66685f;margin:0;line-height:1.6;max-width:660px}.controls{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.controls button{background:#f8f8f4;padding:11px 15px;border:1px solid #bfc1b7;border-radius:4px}.controls button[aria-pressed=true]{background:#252723;color:white}.compare{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;max-width:1440px;margin:auto;padding:10px 32px 24px}.direction-title{display:flex;justify-content:space-between;border-top:1px solid #5b5e55;padding:13px 0 18px}.direction-title strong{font-size:15px;font-weight:500}.direction-title span{font:italic 14px Georgia;color:#5c5e56}.direction-copy{font-size:12px;color:#62665c;height:32px;line-height:1.4;margin:0 0 12px}.phone{height:800px;max-height:85vh;min-height:610px;background:var(--paper);border:1px solid #b4b7ac;border-radius:30px;overflow:hidden;position:relative;box-shadow:0 12px 30px #24251c12}.status{height:29px;display:flex;align-items:center;justify-content:space-between;padding:12px 22px 0;font-size:10px;font-weight:600}.status i{display:inline-block;width:52px;height:13px;background:#222;border-radius:15px;position:absolute;left:calc(50% - 26px);top:8px}.shell{height:63px;display:flex;align-items:center;justify-content:space-between;margin:0 20px;border-bottom:1px solid var(--rule)}.brand{font-weight:700;letter-spacing:3px;font-size:12px}.pager{display:flex;align-items:center;gap:15px;font-size:11px;letter-spacing:1.3px}.pager button{min-width:25px;min-height:38px;font-size:20px}.pager .name{font-size:11px;min-width:48px;text-align:center;font-weight:500}.identity{height:28px;width:28px;border:1px solid #aaa;border-radius:50%;font:12px Georgia;cursor:default}.scope{display:flex;align-items:center;gap:16px;margin:0 20px;height:45px}.scope button{font-size:10px;letter-spacing:1.1px;color:#73766c;height:31px}.scope button.active{color:var(--ink);border-bottom:1px solid var(--ink)}.scope small{margin-left:auto;font-size:9px;color:#85877e;letter-spacing:1px}.scroll{height:calc(100% - 137px);overflow:auto;scrollbar-width:none;padding:3px 20px 38px;overscroll-behavior:contain}.scroll::-webkit-scrollbar{display:none}.section-label{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--ink);padding:11px 0 10px;margin-top:23px;font-size:9px;letter-spacing:1.3px;text-transform:uppercase}.section-label em{font-style:normal;color:var(--muted);letter-spacing:0}.kicker{font-size:9px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}h2,h3,p{margin:0}.intro{margin-bottom:18px}.intro h2{font:38px/.99 Georgia;letter-spacing:-1.4px;margin:5px 0 9px}.intro p{color:var(--muted);font-size:11px}.cover{display:block;width:100%;object-fit:cover;background:#ddd}.open{display:block;text-align:left;width:100%}.title{font:24px/1.04 Georgia;letter-spacing:-.5px}.blurb{font:14px/1.45 Georgia;color:#4d5149;margin-top:7px}.social{font-size:10px;color:#555a4f;text-align:left;padding:12px 0;display:flex;gap:6px;align-items:center;width:100%}.social .avatars{font-size:8px;letter-spacing:-3px;margin-right:4px}.activity-row{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--rule);padding:10px 0;font-size:10px}.increment{border:1px solid #8d9184;min-width:39px;height:33px;font-size:13px;border-radius:2px}.save{border-bottom:1px solid var(--ink);font-size:10px;padding:6px 0;display:inline-block}.news{padding:11px 0;display:grid;grid-template-columns:50px 1fr;gap:12px;border-bottom:1px solid var(--rule)}.news time{font-size:9px;line-height:1.7;color:#75796e}.news h3{font:16px/1.15 Georgia}.news p{font-size:10px;color:var(--muted);line-height:1.5;margin-top:5px}.mini{display:grid;grid-template-columns:62px 1fr;gap:13px;padding:10px 0}.mini img{height:85px;object-fit:cover}.mini h3{font:18px/1.1 Georgia}.mini .blurb{font-size:12px}.mini .social{padding:8px 0 0}.pair{display:grid;grid-template-columns:1fr 1fr;gap:13px}.pair img{aspect-ratio:2/2.7}.pair h3{font:18px/1.05 Georgia;margin-top:9px}.pair p{font-size:12px;line-height:1.35;color:var(--muted);margin-top:5px}.pair .save{margin-top:5px}.endnote{font:italic 13px Georgia;color:#6c7164;margin:25px 0 0;text-align:center}.edition .lead-image{height:170px;margin-bottom:12px;object-position:center 75%}.edition .lead-head{display:flex;gap:12px;align-items:start}.edition .lead-head>span{font:49px/.9 Georgia;letter-spacing:-3px;color:#9d9f93}.edition .lead-head .title{font-size:29px}.edition .lead-head .blurb{font-size:14px}.edition .intro h2{font-size:38px}.index{--paper:#f5f6f2}.index .intro{display:flex;justify-content:space-between;align-items:end}.index .intro h2{font:600 38px/.92 Arial;letter-spacing:-2px}.index .intro p{width:75px;font-size:10px;line-height:1.45}.index .title,.index .news h3,.index .mini h3,.index .pair h3{font-family:Arial;font-weight:600;letter-spacing:-.8px}.index .blurb{font-family:Arial;font-size:12px;line-height:1.5}.index .index-lead{display:grid;grid-template-columns:118px 1fr;gap:14px;padding:15px 0;border-top:3px solid var(--ink)}.index .index-lead img{height:170px;object-fit:cover}.index .index-lead .title{font-size:23px;margin-top:8px}.index .ordinal{font-size:10px;color:#7a7f71}.index .social{border-bottom:1px solid var(--rule);font-size:10px}.index .section-label{border-top:3px solid var(--ink);font-weight:700}.index .timeline{border-left:1px solid #9b9e94;margin-left:6px;padding-left:15px}.index .news{grid-template-columns:43px 1fr;position:relative}.index .news:before{content:'';position:absolute;left:-19px;top:15px;width:6px;height:6px;background:var(--ink)}.index .pair{gap:17px}.index .pair img{aspect-ratio:1/1.1;object-position:center 25%}.index .pair h3{font-size:18px}.index .activity-row{background:#e5e8dd;border:0;padding:9px 10px}.gallery{--paper:#f5f1e9;--rule:#ccc7bd}.gallery .intro h2{font:38px/.97 Georgia}.gallery .gallery-lead{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:end;margin:19px 0 12px}.gallery .gallery-lead img{height:auto;aspect-ratio:2/3;object-fit:contain}.gallery .gallery-lead .title{font:29px/.97 Georgia;letter-spacing:-1px;margin:10px 0}.gallery .gallery-lead .blurb{font-size:14px}.gallery .section-label{border-top:1px solid #797b70;letter-spacing:2px;margin-top:26px}.gallery .news{grid-template-columns:50px 1fr}.gallery .mini{grid-template-columns:1fr 95px;margin-top:3px}.gallery .mini>img{grid-column:2;grid-row:1;width:95px;height:123px}.gallery .mini>div{grid-column:1;grid-row:1}.gallery .pair img{aspect-ratio:2/3}.gallery .pair>div:nth-child(2){padding-top:34px}.gallery .social{font-family:Georgia;font-size:12px}.gallery .activity-row{margin-top:15px}.sheet{position:absolute;inset:29px 0 0;z-index:5;background:var(--paper);overflow:auto;padding:0 20px 28px;scrollbar-width:none;animation:rise .25s ease-out}.sheet-bar{position:sticky;top:0;z-index:1;background:var(--paper);height:48px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--rule);font-size:10px;letter-spacing:1px}.sheet-bar button{height:44px;min-width:40px;font-size:20px}.sheet-cover{height:250px;width:100%;object-fit:cover;object-position:center 30%;margin:18px 0}.sheet h2{font:36px/1.02 Georgia;letter-spacing:-1px;margin:13px 0 5px}.sheet .blurb{font-size:17px}.sheet .primary{display:block;width:100%;background:var(--ink);color:white;padding:15px;margin:20px 0 12px;font-size:12px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.tabs button{font-size:10px;border:1px solid var(--rule);padding:10px}.tabs button[aria-pressed=true]{border-color:var(--ink);background:#e3e4dc}.comment{border-bottom:1px solid var(--rule);padding:18px 0}.comment strong{font-size:11px;font-weight:500}.comment p{font:17px/1.4 Georgia;margin:8px 0}.comment small{color:var(--muted);font-size:10px}.sheet .spoiler{font-size:11px;border:1px solid var(--rule);padding:12px;width:100%;text-align:left}.toast{position:absolute;bottom:14px;left:15px;right:15px;background:#23261f;color:#fff;padding:13px;z-index:8;display:flex;justify-content:space-between;font-size:11px;box-shadow:0 2px 10px #0002}.toast button{color:white;text-decoration:underline;min-width:40px}.rationale{max-width:1440px;padding:5px 32px 35px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:28px;color:#62655a;font-size:12px;line-height:1.65}.rationale b{display:block;font-weight:500;color:#34392d}.lab-note{font-size:10px!important;color:#7c8074!important;margin-top:8px!important}@keyframes rise{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}@media(max-width:1050px){.compare{grid-template-columns:repeat(3,355px);overflow:auto;scroll-snap-type:x mandatory}.direction{scroll-snap-align:center}.phone{height:780px;max-height:none}.rationale{grid-template-columns:1fr}.lab{flex-wrap:wrap}.lab h1{font-size:30px}}@media(min-width:1600px){.phone{height:850px}}
.scroll>.section-label:first-child{margin-top:5px;border-top:0;padding-top:7px}.gallery .gallery-lead{margin-top:5px}.index .index-lead{padding-top:5px;border-top:0}.index .sheet h2{font-family:Arial;font-weight:600}</style></head><body>
<header class="lab"><div><div class="eyebrow">Kuro / Design study 01</div><h1>Three directions.</h1><p class="lab-note">Interactive prototypes · Sample data · App unchanged</p></div><div class="controls"><a href="panels.html" style="margin-right:12px;text-decoration:underline">New: Panels ↗</a><button data-page="home" aria-pressed="true">Home</button><button data-page="taste" aria-pressed="false">Taste</button><button id="reset">Reset demo ↺</button></div></header>
<main class="compare" id="compare"></main>
<script src="art.js"></script><script>
const directions=[{id:'edition',name:'The Edition',tag:'A personal front page',copy:'Editorial hierarchy. Compact dispatches. A sense of occasion.'},{id:'index',name:'The Index',tag:'Clarity has character',copy:'Typographic structure. Small covers. Useful information, close at hand.'},{id:'gallery',name:'The Gallery',tag:'Room to look',copy:'Asymmetric compositions. Intact covers. Deliberate visual pacing.'}];
let page='home',medium='anime',progress={anime:7,manga:24},saved=new Set(),statuses={},overlay=null,toastTimer;
const blurbs={anime:['A world of secrets, with very little room to breathe.','A clear-hearted adventure, carried by expressive action.','Sharp-edged battles and an unruly sense of humour.','A battle of intellect, where every decision has weight.'],manga:['Brutal, absurd, and unexpectedly tender.','Fast-moving spectacle. Always another threshold.','Restless action with something darker underneath.','An unforgiving world, drawn with extraordinary care.']};
const vibes={anime:['Tense. Unpredictable.','Heart and spectacle.','Dark, restless action.','A battle of wits.'],manga:['Brutal. Absurd. Tender.','Relentless momentum.','Dark, restless action.','Beautifully unforgiving.']};
const picks=()=>ART.filter(x=>x.kind===medium);const unit=()=>medium==='anime'?'Episode':'Chapter';const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function image(i,cls=''){let t=picks()[i];return `<img class="cover ${cls}" src="${t.image}" alt="${esc(t.title)} cover">`}
function social(i){return `<button class="social" data-club="${i}" aria-label="See club activity for ${esc(picks()[i].title)}"><span class="avatars">◯◯</span> ${i===0?'3':'2'} in club <span style="margin-left:auto">${i===0?'1 note':'2 notes'} ↗</span></button>`}
function add(i){return `<button class="save" data-add="${i}">${saved.has(medium+i)?'✓ Saved':'+ Save'}</button>`}
function progressRow(){return `<div class="activity-row"><span>${unit()} <b>${progress[medium]}</b> · ${statuses[medium+'0']||(medium==='anime'?'Watching':'Reading')}</span><button class="increment" data-progress aria-label="Mark next ${unit().toLowerCase()} complete">+1</button></div>`}
function section(label,right=''){return `<div class="section-label"><span>${label}</span><em>${right}</em></div>`}
function lead(v,i=0){let t=picks()[i];if(v==='edition')return `<button class="open" data-open="${i}">${image(i,'lead-image')}<div class="lead-head"><span>${page==='home'?'01':'↗'}</span><div><h3 class="title">${esc(t.title)}</h3>${page==='taste'?`<p class="blurb">${vibes[medium][i]}</p>`:''}</div></div></button>`;if(v==='index')return `<div class="index-lead"><button class="open" data-open="${i}">${image(i)}</button><div><button class="open" data-open="${i}"><h3 class="title">${esc(t.title)}</h3></button>${page==='taste'?`<p class="blurb">${vibes[medium][i]}</p>`:''}<div style="margin-top:9px">${page==='taste'?add(i):''}</div></div></div>`;return `<div class="gallery-lead"><button class="open" data-open="${i}">${image(i)}</button><div><button class="open" data-open="${i}"><h3 class="title">${esc(t.title)}</h3></button>${page==='taste'?`<p class="blurb">${vibes[medium][i]}</p>`:''}${page==='taste'?add(i):''}</div></div>`}
function mini(i){return `<div class="mini">${image(i)}<div><button class="open" data-open="${i}"><h3>${esc(picks()[i].title)}</h3></button>${social(i)}</div></div>`}
function pair(){return `<div class="pair">${[2,3].map(i=>`<div><button class="open" data-open="${i}">${image(i)}<h3>${esc(picks()[i].title)}</h3></button>${add(i)}</div>`).join('')}</div>`}
function releases(v){return `<div class="${v==='index'?'timeline':''}"><button class="open news" data-open="1"><time>TMRW<br>18:00</time><div><h3>${esc(picks()[1].title)}</h3><p>${medium==='anime'?'Next episode':'Next volume'}</p></div></button><button class="open news" data-open="2"><time>LATER<br>TBA</time><div><h3>${esc(picks()[2].title)}</h3><p>Announced</p></div></button></div>`}
function content(v){if(page==='home')return `${section('Continue')}${lead(v)}${progressRow()}${social(0)}${section('Upcoming')}${releases(v)}${section('Your club')}${mini(3)}`;return `${section('For you')}${lead(v,1)}${v==='edition'?add(1):''}${social(1)}${section('Explore')}${pair()}${section('Rediscover')}${mini(0)}${add(0)}`;}
function render(){document.querySelector('#compare').innerHTML=directions.map(d=>`<section class="direction"><div class="direction-title"><strong>0${directions.indexOf(d)+1} / ${d.name}</strong></div><div class="phone ${d.id}" data-variant="${d.id}"><div class="status">9:41<i></i><span>••• ▰</span></div><nav class="shell"><span class="brand">KURO</span><div class="pager"><button data-nav="taste" aria-label="Open Taste">‹</button><button class="name" data-toggle>${page==='home'?'HOME':'TASTE'}</button><button data-nav="home" aria-label="Open Home">›</button></div><span class="identity" style="display:grid;place-items:center" title="Profile is outside this prototype">M</span></nav><div class="scope"><button class="${medium==='anime'?'active':''}" data-medium="anime">ANIME</button><button class="${medium==='manga'?'active':''}" data-medium="manga">MANGA</button></div><div class="scroll">${content(d.id)}</div></div></section>`).join('');document.querySelectorAll('[data-page]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.page===page)));if(overlay)drawOverlay();}
function toast(v,text,undo){let phone=document.querySelector(`[data-variant="${v}"]`);phone.querySelector('.toast')?.remove();let t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=text;if(undo){let b=document.createElement('button');b.textContent='Undo';b.onclick=()=>{undo();render()};t.append(b)}phone.append(t);clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.remove(),4500)}
function drawOverlay(){let {v,i,type}=overlay,t=picks()[i],phone=document.querySelector(`[data-variant="${v}"]`);document.querySelectorAll('.sheet').forEach(s=>s.remove());let el=document.createElement('section');el.className='sheet';el.setAttribute('role','dialog');el.setAttribute('aria-label',type==='club'?'Club activity':t.title);el.innerHTML=`<div class="sheet-bar"><button data-close aria-label="Close title">←</button><span>${type==='club'?'THE SUNDAY CLUB':'IN FOCUS'}</span><span>${medium.toUpperCase()}</span></div>`+(type==='club'?`<h2>${esc(t.title)}</h2><div class="section-label">3 members ${medium==='anime'?'watching':'reading'}</div><div class="comment"><strong>Mina · ${unit()} 7</strong><p>“The quiet moments are what keep me coming back.”</p><small>Sample comment · No spoilers</small></div><div class="comment"><strong>Alex · Ahead of your progress</strong><p><button class="spoiler" data-reveal>Comment hidden · Reveal spoiler</button></p></div><div class="comment"><strong>Jules · Just started</strong><p>On their ${medium==='anime'?'watchlist':'reading list'}.</p></div>`:`${image(i,'sheet-cover')}<div class="kicker">${medium==='anime'?'Anime · Series':'Manga · Series'}</div><h2>${esc(t.title)}</h2><p class="blurb">${blurbs[medium][i]}</p>${i===0?progressRow():`<button class="primary" data-add="${i}">${saved.has(medium+i)?'✓ On your list':'+ Add to my list'}</button>`}<div class="tabs" aria-label="List status">${['Planned',medium==='anime'?'Watching':'Reading','Completed'].map(x=>`<button data-status="${x}" aria-pressed="${(statuses[medium+i]||(i===0?(medium==='anime'?'Watching':'Reading'):'Planned'))===x}">${x}</button>`).join('')}</div>${social(i)}`);phone.append(el);el.querySelector('[data-close]').focus({preventScroll:true});}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let v=b.closest('[data-variant]')?.dataset.variant||'edition';if(b.dataset.page||b.dataset.nav){page=b.dataset.page||b.dataset.nav;overlay=null;render()}else if(b.hasAttribute('data-toggle')){page=page==='home'?'taste':'home';overlay=null;render()}else if(b.dataset.medium){medium=b.dataset.medium;overlay=null;render()}else if(b.hasAttribute('data-open')){overlay={v,i:Number(b.dataset.open),type:'detail'};drawOverlay()}else if(b.hasAttribute('data-club')){overlay={v,i:Number(b.dataset.club),type:'club'};drawOverlay()}else if(b.hasAttribute('data-close')){overlay=null;b.closest('.sheet').remove()}else if(b.hasAttribute('data-progress')){let prev=progress[medium],m=medium;progress[m]++;render();toast(v,`${unit()} ${progress[m]} recorded`,()=>progress[m]=prev)}else if(b.hasAttribute('data-add')){let key=medium+b.dataset.add,had=saved.has(key);if(had)saved.delete(key);else saved.add(key);render();toast(v,had?'Removed from list':'Added to your planned list',()=>had?saved.add(key):saved.delete(key))}else if(b.dataset.status){let key=medium+overlay.i;statuses[key]=b.dataset.status;saved.add(key);render();toast(v,'List updated')}else if(b.hasAttribute('data-reveal')){b.replaceWith(document.createTextNode('Sample spoiler revealed. This is where a club member’s protected comment would appear.'))}else if(b.id==='reset'){page='home';medium='anime';progress={anime:7,manga:24};saved.clear();statuses={};overlay=null;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&overlay){overlay=null;document.querySelector('.sheet')?.remove()}});render();
</script></body></html>
