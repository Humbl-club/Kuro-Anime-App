<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kuro · Screen canvas</title><style>
*{box-sizing:border-box}body{margin:0;background:#eae8e3;color:#272623;font:13px system-ui;overflow:hidden}header{height:80px;background:#faf9f6;border-bottom:1px solid #ccc;display:flex;align-items:center;padding:16px 24px;gap:15px}h1{font:26px Georgia;margin:0 auto 0 0}button,input{padding:10px 14px;border:1px solid #ccc;border-radius:7px;background:white}#viewport{height:calc(100vh - 118px);overflow:hidden;cursor:grab;touch-action:none;background-image:radial-gradient(#bcbab4 1px,transparent 1px);background-size:20px 20px}#board{transform-origin:0 0;display:grid;grid-template-columns:repeat(6,260px);gap:35px;padding:40px;width:max-content}article{width:260px}article h2{font:16px Georgia;margin:0 0 10px}img{width:260px;display:block;border-radius:22px;box-shadow:0 5px 18px #0002;background:white}small{display:block;margin:10px 0;color:#666;font-size:10px}footer{height:38px;padding:10px 20px;background:#faf9f6;font-size:11px}dialog{border:0;padding:15px;border-radius:20px;max-height:95vh}dialog img{height:85vh;width:auto}#status{max-width:430px;font-size:11px}#empty{padding:40px;font-size:20px}button{cursor:pointer}.copy-actions{display:flex;gap:6px;margin-top:10px}.copy-actions button,.copy-actions a{font:12px system-ui;padding:9px;border:1px solid #ccc;border-radius:7px;background:#fff;color:#222;text-decoration:none}#copyFallback textarea{width:min(650px,75vw);height:240px;display:block;margin:12px 0;font:14px monospace}</style>
<header><h1>Kuro / Screen canvas</h1><span id="status">Loading captures…</span><input id="search" placeholder="Find a screen" aria-label="Find a screen"><button id="minus">−</button><span id="zoom">40%</span><button id="plus">+</button><button id="fit">Fit all</button></header><div id="viewport"><div id="board"></div></div><footer id="note">Current original project · Drag to pan · Scroll to zoom · Click a frame to inspect</footer><dialog id="detail"><button onclick="this.parentElement.close()">Close</button><img alt="Enlarged screen"></dialog>
<dialog id="copyFallback"><h2>Copy screen reference</h2><textarea aria-label="Screen reference" readonly></textarea><p>Select the text and copy it with ⌘C or Ctrl+C.</p><button onclick="this.parentElement.close()">Close</button></dialog>
<script>
const screenSources={"welcome": "Kuro/Views/AuthView.swift", "signin": "Kuro/Views/AuthView.swift", "signup": "Kuro/Views/AuthView.swift", "genie": "Kuro/Views/AuthView.swift", "onboarding": "Kuro/Views/OnboardingView.swift", "onboarding1": "Kuro/Views/OnboardingView.swift", "onboarding2": "Kuro/Views/OnboardingView.swift", "onboarding3": "Kuro/Views/OnboardingView.swift", "onboarding4": "Kuro/Views/OnboardingView.swift", "taste": "Kuro/Views/TastePicksView.swift", "taste-manga": "Kuro/Views/TastePicksView.swift", "discover": "Kuro/Views/EditorialDiscoverView.swift", "genres": "Kuro/Views/EditorialDiscoverView.swift", "browse": "Kuro/Views/BrowseView.swift", "browse-manga": "Kuro/Views/BrowseView.swift", "collection": "Kuro/Views/EditorialCollectionView.swift", "clubs": "Kuro/Views/ClubsView.swift", "createclub": "Kuro/Views/ClubsView.swift", "joinclub": "Kuro/Views/ClubsView.swift", "search": "Kuro/Views/EditorialSearchView.swift", "profile": "Kuro/Views/ProfileView.swift", "services": "Kuro/Views/ProfileView.swift", "concierge": "Kuro/Views/ConciergeView.swift", "rail": "Kuro/Views/ClubCreateSheets.swift", "poll": "Kuro/Views/ClubCreateSheets.swift", "club-rails": "Kuro/Views/ClubDetailView.swift", "club-active": "Kuro/Views/ClubDetailView.swift", "club-polls": "Kuro/Views/ClubDetailView.swift", "club-settings": "Kuro/Views/ClubDetailSheets.swift", "railitem": "Kuro/Views/ClubDetailSheets.swift", "anime": "Kuro/Views/DetailPages/AnimeDetailView.swift", "episodes": "Kuro/Views/DetailPages/AnimeDetailView.swift", "providers": "Kuro/Views/DetailPages/AnimeDetailView.swift", "manga": "Kuro/Views/DetailPages/MangaDetailView.swift", "chapters": "Kuro/Views/DetailPages/MangaDetailView.swift", "addanime": "Kuro/Views/AddToListSheet.swift", "addmanga": "Kuro/Views/AddToListSheet.swift", "filters": "Kuro/Views/BrowseComponents.swift", "genre": "Kuro/Views/GenreHubView.swift", "character": "Kuro/Views/DetailPages/EntityDetailSheets.swift", "staff": "Kuro/Views/DetailPages/EntityDetailSheets.swift", "studio": "Kuro/Views/DetailPages/EntityDetailSheets.swift", "author": "Kuro/Views/DetailPages/EntityDetailSheets.swift", "credits": "Kuro/Views/DetailPages/CreditsSection.swift", "cast": "Kuro/Views/DetailPages/CastSection.swift", "import": "Kuro/Views/ConciergeView+AniListImport.swift", "verdict": "Kuro/Views/QuickVerdictActionCard.swift", "quickactions": "Kuro/Views/QuickVerdictActionCard.swift", "leanings": "Kuro/Views/TasteDeckView.swift", "addclub": "Kuro/Views/DetailPages/ClubActivitySection.swift", "franchise": "Kuro/Views/DetailPages/AdaptationPathSection.swift", "why": "Kuro/Views/ConciergeRecommendationRails.swift"};
function referenceFor(f,m){return `Work on the Kuro screen: ${f.title}
Screen ID: ${f.id}
SwiftUI source: ${screenSources[f.id]||"See scripts/capture_screen_canvas.py"}
Screenshot: tools/screen-canvas/captures/${f.id}.png
Capture: ${m.capturedAt || "unknown"}; source fingerprint: ${m.version}
Preview state: ${f.note}
Edit the original SwiftUI view, not the screenshot or canvas HTML. Read the current source first; shared files may contain other screens.
Requested changes: `;}
async function copyReference(button,f,m){const text=referenceFor(f,m);try{await navigator.clipboard.writeText(text);button.textContent='Copied';setTimeout(()=>button.textContent='Copy reference',1800)}catch{const d=document.querySelector('#copyFallback'),t=d.querySelector('textarea');t.value=text;d.showModal();t.focus();t.select()}}
async function copyImage(button,img){try{if(!navigator.clipboard?.write||!window.ClipboardItem)throw Error();const canvas=document.createElement('canvas');canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;canvas.getContext('2d').drawImage(img,0,0);const png=new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(Error()),'image/png'));await navigator.clipboard.write([new ClipboardItem({'image/png':png})]);button.textContent='Image copied';setTimeout(()=>button.textContent='Copy image',1800)}catch{button.textContent='Use Save PNG →';setTimeout(()=>button.textContent='Copy image',3000)}}
const board=document.querySelector('#board'),vp=document.querySelector('#viewport');let z=.4,x=0,y=0,drag=null,moved=false,last='';function paint(){board.style.transform=`translate(${x}px,${y}px) scale(${z})`;document.querySelector('#zoom').textContent=Math.round(z*100)+'%'}function fit(){const count=Array.from(board.children).filter(a=>!a.hidden).length;board.style.gridTemplateColumns=`repeat(${Math.max(1,Math.ceil(Math.sqrt(count*vp.clientWidth/vp.clientHeight*2.4)))},260px)`;z=Math.min(vp.clientWidth/board.scrollWidth,vp.clientHeight/board.scrollHeight,.8);x=Math.max(0,(vp.clientWidth-board.scrollWidth*z)/2);y=0;paint()}function zoom(n){z=Math.min(2,Math.max(.08,z*n));paint()}document.querySelector('#plus').onclick=()=>zoom(1.2);document.querySelector('#minus').onclick=()=>zoom(1/1.2);document.querySelector('#fit').onclick=fit;vp.onwheel=e=>{e.preventDefault();zoom(e.deltaY<0?1.08:1/1.08)};vp.onpointerdown=e=>{if(e.target.closest('button,a'))return;drag=[e.clientX-x,e.clientY-y];moved=false};window.onpointermove=e=>{if(drag){moved=true;x=e.clientX-drag[0];y=e.clientY-drag[1];paint()}};window.onpointerup=()=>drag=null;document.querySelector('#search').oninput=e=>{for(const a of board.children)a.hidden=!a.textContent.toLowerCase().includes(e.target.value.toLowerCase())};async function poll(){try{const m=await(await fetch('/manifest.json',{cache:'no-store'})).json();document.querySelector('#status').textContent=m.status+' · '+(m.frames?.length||0)+' frames · '+(m.capturedAt||'First build')+' · Original project';document.querySelector('#note').textContent=m.limitations||'Building actual SwiftUI screens. Previous captures stay visible while rebuilding.';if(m.version&&(m.generation||m.version)!==last){last=m.generation||m.version;board.replaceChildren();for(const f of m.frames){const a=document.createElement('article'),h=document.createElement('h2'),im=document.createElement('img'),s=document.createElement('small');h.textContent=f.title;im.src='/captures/'+f.image;im.alt=f.title;s.textContent=f.note;const actions=document.createElement('div'),copy=document.createElement('button'),picture=document.createElement('button'),save=document.createElement('a');actions.className='copy-actions';copy.textContent='Copy reference';copy.setAttribute('aria-label','Copy reference for '+f.title);copy.onclick=()=>copyReference(copy,f,m);picture.textContent='Copy image';picture.setAttribute('aria-label','Copy image for '+f.title);picture.onclick=()=>copyImage(picture,im);save.textContent='Save PNG';save.href=im.src;save.download=f.id+'.png';actions.append(copy,picture,save);a.append(h,im,actions,s);board.append(a);im.onclick=()=>{if(moved)return;document.querySelector('dialog img').src=im.src;document.querySelector('dialog').showModal()}}setTimeout(fit,500)}}catch(e){document.querySelector('#status').textContent='Waiting for first capture build…'}}paint();poll();setInterval(poll,2000);
</script></html>
