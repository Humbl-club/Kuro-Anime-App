<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kuro · Screen canvas</title><style>
*{box-sizing:border-box}body{margin:0;background:#eae8e3;color:#272623;font:13px system-ui;overflow:hidden}header{height:80px;background:#faf9f6;border-bottom:1px solid #ccc;display:flex;align-items:center;padding:16px 24px;gap:15px}h1{font:26px Georgia;margin:0 auto 0 0}button,input{padding:10px 14px;border:1px solid #ccc;border-radius:7px;background:white}#viewport{height:calc(100vh - 118px);overflow:hidden;cursor:grab;touch-action:none;background-image:radial-gradient(#bcbab4 1px,transparent 1px);background-size:20px 20px}#board{transform-origin:0 0;display:grid;grid-template-columns:repeat(6,260px);gap:35px;padding:40px;width:max-content}article{width:260px}article h2{font:16px Georgia;margin:0 0 10px}img{width:260px;display:block;border-radius:22px;box-shadow:0 5px 18px #0002;background:white}small{display:block;margin:10px 0;color:#666;font-size:10px}footer{height:38px;padding:10px 20px;background:#faf9f6;font-size:11px}dialog{border:0;padding:15px;border-radius:20px;max-height:95vh}dialog img{height:85vh;width:auto}#status{max-width:430px;font-size:11px}#empty{padding:40px;font-size:20px}button{cursor:pointer}</style>
<header><h1>Kuro / Screen canvas</h1><span id="status">Loading captures…</span><input id="search" placeholder="Find a screen" aria-label="Find a screen"><button id="minus">−</button><span id="zoom">40%</span><button id="plus">+</button><button id="fit">Fit all</button></header><div id="viewport"><div id="board"></div></div><footer id="note">Current original project · Drag to pan · Scroll to zoom · Click a frame to inspect</footer><dialog id="detail"><button onclick="this.parentElement.close()">Close</button><img alt="Enlarged screen"></dialog>
<script>
const board=document.querySelector('#board'),vp=document.querySelector('#viewport');let z=.4,x=0,y=0,drag=null,moved=false,last='';function paint(){board.style.transform=`translate(${x}px,${y}px) scale(${z})`;document.querySelector('#zoom').textContent=Math.round(z*100)+'%'}function fit(){const count=Array.from(board.children).filter(a=>!a.hidden).length;board.style.gridTemplateColumns=`repeat(${Math.max(1,Math.ceil(Math.sqrt(count*vp.clientWidth/vp.clientHeight*2.4)))},260px)`;z=Math.min(vp.clientWidth/board.scrollWidth,vp.clientHeight/board.scrollHeight,.8);x=Math.max(0,(vp.clientWidth-board.scrollWidth*z)/2);y=0;paint()}function zoom(n){z=Math.min(2,Math.max(.08,z*n));paint()}document.querySelector('#plus').onclick=()=>zoom(1.2);document.querySelector('#minus').onclick=()=>zoom(1/1.2);document.querySelector('#fit').onclick=fit;vp.onwheel=e=>{e.preventDefault();zoom(e.deltaY<0?1.08:1/1.08)};vp.onpointerdown=e=>{drag=[e.clientX-x,e.clientY-y];moved=false};window.onpointermove=e=>{if(drag){moved=true;x=e.clientX-drag[0];y=e.clientY-drag[1];paint()}};window.onpointerup=()=>drag=null;document.querySelector('#search').oninput=e=>{for(const a of board.children)a.hidden=!a.textContent.toLowerCase().includes(e.target.value.toLowerCase())};async function poll(){try{const m=await(await fetch('/manifest.json',{cache:'no-store'})).json();document.querySelector('#status').textContent=m.status+' · '+(m.frames?.length||0)+' frames · '+(m.capturedAt||'First build')+' · Original project';document.querySelector('#note').textContent=m.limitations||'Building actual SwiftUI screens. Previous captures stay visible while rebuilding.';if(m.version&&(m.generation||m.version)!==last){last=m.generation||m.version;board.replaceChildren();for(const f of m.frames){const a=document.createElement('article'),h=document.createElement('h2'),im=document.createElement('img'),s=document.createElement('small');h.textContent=f.title;im.src='/captures/'+f.image;im.alt=f.title;s.textContent=f.note;a.append(h,im,s);board.append(a);im.onclick=()=>{if(moved)return;document.querySelector('dialog img').src=im.src;document.querySelector('dialog').showModal()}}setTimeout(fit,500)}}catch(e){document.querySelector('#status').textContent='Waiting for first capture build…'}}paint();poll();setInterval(poll,2000);
</script></html>
