<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<title>Verify your email — Kuro</title>
<!--[if mso]>
<style>table,td{font-family:Arial,Helvetica,sans-serif !important;}</style>
<![endif]-->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;1,300&display=swap');
</style>
</head>
<body style="margin:0;padding:0;background-color:#f5f5f0;-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif;">

<!-- Outer wrapper -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f5f5f0;">
<tr><td align="center" style="padding:48px 16px 48px 16px;">

<!-- Inner card -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:460px;background-color:#ffffff;">

<!-- Top spacer -->
<tr><td style="height:56px;"></td></tr>

<!-- Logo wordmark -->
<tr><td align="center" style="padding:0 40px;">
  <span style="font-family:'Cormorant',Georgia,'Times New Roman',serif;font-weight:300;font-size:42px;color:#0a0a0a;letter-spacing:0.2em;line-height:1;">K</span>
</td></tr>

<!-- Rule -->
<tr><td align="center" style="padding:28px 40px 0;">
  <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
    <td style="width:32px;height:1px;background-color:rgba(0,0,0,0.12);font-size:0;line-height:0;">&nbsp;</td>
  </tr></table>
</td></tr>

<!-- Heading -->
<tr><td align="center" style="padding:28px 40px 0;">
  <p style="margin:0;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:10px;font-weight:600;letter-spacing:0.22em;text-transform:uppercase;color:rgba(0,0,0,0.4);">Verify Your Email</p>
</td></tr>

<!-- Body text -->
<tr><td align="center" style="padding:20px 48px 0;">
  <p style="margin:0;font-family:'Cormorant',Georgia,'Times New Roman',serif;font-size:17px;font-weight:300;font-style:italic;line-height:1.65;color:rgba(0,0,0,0.55);">
    Tap the button below to confirm your email address and unlock your Kuro account.
  </p>
</td></tr>

<!-- CTA button -->
<tr><td align="center" style="padding:32px 40px 0;">
  <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
    <td align="center" style="background-color:#0a0a0a;">
      <a href="{{ .ConfirmationURL }}" target="_blank" rel="noopener noreferrer" style="display:inline-block;padding:14px 44px;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:11px;font-weight:600;letter-spacing:0.2em;text-transform:uppercase;color:#f5f5f0;text-decoration:none;mso-padding-alt:0;">
        <!--[if mso]><i style="mso-font-width:400%;mso-text-raise:21pt;">&nbsp;</i><![endif]-->
        <span style="mso-text-raise:12pt;">Confirm Email</span>
        <!--[if mso]><i style="mso-font-width:400%;">&nbsp;</i><![endif]-->
      </a>
    </td>
  </tr></table>
</td></tr>

<!-- Expiry note -->
<tr><td align="center" style="padding:24px 48px 0;">
  <p style="margin:0;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:11px;color:rgba(0,0,0,0.25);letter-spacing:0.04em;">
    This link expires in 24 hours.
  </p>
</td></tr>

<!-- Bottom rule -->
<tr><td align="center" style="padding:40px 40px 0;">
  <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
    <td style="width:100%;height:1px;background-color:rgba(0,0,0,0.06);font-size:0;line-height:0;">&nbsp;</td>
  </tr></table>
</td></tr>

<!-- Footer -->
<tr><td align="center" style="padding:20px 40px 0;">
  <p style="margin:0;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:10px;color:rgba(0,0,0,0.2);letter-spacing:0.08em;line-height:1.7;">
    You received this because you created a Kuro account.<br>
    If this wasn't you, you can safely ignore this email.
  </p>
</td></tr>

<!-- Brand footer -->
<tr><td align="center" style="padding:20px 40px 0;">
  <p style="margin:0;font-family:'Cormorant',Georgia,'Times New Roman',serif;font-size:12px;font-weight:400;color:rgba(0,0,0,0.15);letter-spacing:0.15em;">
    KURO
  </p>
</td></tr>

<!-- Bottom spacer -->
<tr><td style="height:48px;"></td></tr>

</table>
<!-- /Inner card -->

</td></tr>
</table>
<!-- /Outer wrapper -->

</body>
</html>
